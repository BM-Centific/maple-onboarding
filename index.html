<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Project Maple — Moderator Onboarding</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
:root{--accent:#D9772E;--accent-dim:#B75F1E;--accent-soft:rgba(217,119,46,0.15);--accent-ink:#D9772E;--amber:#F59E0B;--amber-bg:#FFF8EC;--amber-text:#92400E;--amber-border:#f5d08a;--green:#22c55e;--green-bg:#EAF3DE;--green-text:#27500A;--red:#ef4444;--red-bg:#FEF2F2;--red-text:#991b1b;--blue:#3b82f6;--blue-bg:#EFF6FF;--blue-text:#1e3a8a;--font:-apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',sans-serif;--font-num:'Avenir Next','Avenir','SF Pro Display',-apple-system,sans-serif;}
[data-theme="dark"]{color-scheme:dark;--bg:#14110F;--bg2:#1D1916;--bg3:#26211D;--bg4:#342C25;--text:#F3EDE6;--text2:#B7ABA0;--text3:#7D726A;--border:#342C25;--border-strong:#4A3F35;--input-bg:#26211D;--card-bg:#1D1916;--nav-bg:rgba(20,17,15,0.88);--sidebar-bg:#1D1916;--shadow-sm:0 2px 12px rgba(0,0,0,0.4);--shadow-md:0 8px 40px rgba(0,0,0,0.5);--shadow-lg:0 20px 60px rgba(0,0,0,0.6);--accent-ink:#E8A463;--bg-glow:#241B12;}
[data-theme="light"]{color-scheme:light;--bg:#FBF6EE;--bg2:#FFFDFA;--bg3:#F5EDE0;--bg4:#EDE0CC;--text:#2B211A;--text2:#6B5D4F;--text3:#9C8C7A;--border:rgba(120,80,40,0.14);--border-strong:rgba(110,70,30,0.24);--input-bg:#F5EDE0;--card-bg:#FFFDFA;--nav-bg:rgba(251,246,238,0.88);--sidebar-bg:#FFFDFA;--shadow-sm:0 2px 12px rgba(60,40,10,0.06);--shadow-md:0 8px 40px rgba(60,40,10,0.10);--shadow-lg:0 20px 60px rgba(60,40,10,0.12);--accent-ink:#B75F1E;--bg-glow:#FFF3DF;}
body{font-family:var(--font);background:radial-gradient(circle at 12% -8%, var(--bg-glow) 0%, transparent 42%),radial-gradient(circle at 100% 105%, var(--bg-glow) 0%, transparent 46%),var(--bg);background-attachment:fixed;color:var(--text);min-height:100vh;letter-spacing:-0.01em;transition:background .3s,color .3s;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}input:focus{outline:none;}
::-webkit-scrollbar{width:10px;height:10px;}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:6px;}

/* login */
#login{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at 12% -8%, var(--bg-glow) 0%, transparent 42%),radial-gradient(circle at 100% 105%, var(--bg-glow) 0%, transparent 46%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:430px;background:var(--card-bg);border:.5px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);padding:34px 30px;animation:fadeUp .5s ease both;}
.login-logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#F0A24D);display:flex;align-items:center;justify-content:center;margin-bottom:18px;font-weight:700;color:#fff;font-size:22px;}
.login-eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px;}
.login-title{font-size:25px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px;}
.login-sub{font-size:14px;color:var(--text2);line-height:1.5;margin-bottom:22px;}
.role-grid{display:flex;flex-direction:column;gap:9px;}
.role-btn{display:flex;align-items:center;gap:13px;padding:14px 15px;border:.5px solid var(--border-strong);border-radius:12px;background:var(--bg3);text-align:left;transition:all .2s cubic-bezier(.34,1.2,.64,1);}
.role-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px);}
.role-ic{width:38px;height:38px;border-radius:11px;background:var(--bg2);border:.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
.role-name{font-size:15px;font-weight:600;}.role-desc{font-size:12px;color:var(--text3);margin-top:2px;}
.demo-tag{display:inline-block;margin-top:20px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amber-text);background:var(--amber-bg);border:.5px solid var(--amber-border);border-radius:20px;padding:4px 10px;}
.lg-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin:2px 0 7px;display:block;}
.lg-input{width:100%;background:var(--input-bg);border:.5px solid var(--border-strong);border-radius:12px;padding:13px 15px;font-size:15px;color:var(--text);}
.lg-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.lg-err{font-size:12px;color:var(--red);margin-top:8px;min-height:15px;}
.lg-go{width:100%;margin-top:6px;background:var(--accent);color:#fff;border-radius:12px;padding:13px;font-weight:500;font-size:15px;transition:all .25s cubic-bezier(.4,0,.2,1);}
.lg-go:hover{background:var(--accent-dim);transform:translateY(-1px);}
.lg-hint{font-size:12px;color:var(--text3);margin-top:12px;line-height:1.45;}


/* nav */
.page-wrap{max-width:1180px;margin:0 auto;padding:0 32px;width:100%;}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 0 18px;}
.nav-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
.nav-logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#F0A24D);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;}
.nav-brand{font-size:15px;font-weight:600;letter-spacing:-.02em;}.nav-brand span{color:var(--text3);font-weight:400;}
.nav-right{display:flex;align-items:center;gap:8px;}
.menu-toggle{width:32px;height:32px;display:none;align-items:center;justify-content:center;border-radius:8px;}
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--text2);transition:background .2s;}
.btn-signout{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:.5px solid var(--border-strong);color:var(--text2);font-size:12.5px;font-weight:600;transition:all .18s;}
.btn-signout:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}
.icon-btn:hover{background:var(--bg3);}
.who{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text2);}
.who-text{text-align:right;line-height:1.4;}
.who-text .role-line{color:var(--accent-ink);}
.user-av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}

.shell{min-height:calc(100vh - 90px);}
.nav-tabs{display:flex;gap:6px;background:var(--bg2);border:.5px solid var(--border);border-radius:13px;padding:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;box-shadow:var(--shadow-sm);margin-bottom:22px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text2);transition:all .2s;flex:1;min-width:fit-content;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#1A1310;font-weight:600;box-shadow:0 4px 14px var(--accent-soft);}

.content{padding:0 0 32px;min-width:0;overflow-x:hidden;width:100%;}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
.page-title{font-size:clamp(22px,2.6vw,29px);font-weight:600;letter-spacing:-.03em;}
.page-sub{font-size:14px;color:var(--text2);margin-top:3px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 17px;border-radius:11px;font-size:14px;font-weight:500;transition:all .22s cubic-bezier(.4,0,.2,1);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dim);transform:translateY(-1px);box-shadow:0 6px 18px var(--accent-soft);}
.btn-secondary{background:var(--bg2);border:.5px solid var(--border-strong);color:var(--text2);}
.btn-secondary:hover{background:var(--bg4);color:var(--text);}
.btn-lg{padding:13px 22px;font-size:15px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* cert banner */
.cert{display:flex;align-items:center;gap:18px;background:var(--card-bg);border:.5px solid var(--border);border-radius:18px;padding:20px 24px;margin-bottom:24px;box-shadow:var(--shadow-sm);}
.cert.done{border-color:rgba(34,197,94,.4);background:linear-gradient(90deg,var(--green-bg),var(--card-bg) 60%);}
[data-theme="dark"] .cert.done{background:linear-gradient(90deg,rgba(34,197,94,.12),var(--card-bg) 60%);}
.cert-ring{width:70px;height:70px;flex-shrink:0;position:relative;}
.cert-ring svg{transform:rotate(-90deg);}
.cert-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:300;font-size:20px;}
.cert-body{flex:1;min-width:0;}
.cert-title{font-size:18px;font-weight:600;letter-spacing:-.02em;}
.cert-desc{font-size:13.5px;color:var(--text2);margin-top:3px;line-height:1.45;}
.badge-ok{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--green-text);background:var(--green-bg);border-radius:20px;padding:5px 12px;}
[data-theme="dark"] .badge-ok{background:rgba(34,197,94,.16);color:#86e0a4;}

/* module list (timeline) */
.mods{position:relative;}
.mod{display:flex;gap:16px;align-items:stretch;}
.mod-rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:34px;}
.mod-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:var(--font-num);border:2px solid var(--border-strong);background:var(--bg3);color:var(--text3);flex-shrink:0;z-index:1;transition:all .2s;}
.mod-dot.done{background:var(--green);border-color:var(--green);color:#fff;}
.mod-dot.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px var(--accent-soft);}
.mod-line{width:2px;flex:1;background:var(--border-strong);margin:2px 0;min-height:14px;}
.mod-line.done{background:var(--green);}
.mod-card{flex:1;background:var(--card-bg);border:.5px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:16px;transition:all .2s;cursor:pointer;}
.mod-card:hover{border-color:var(--border-strong);transform:translateX(2px);}
.mod-card.locked{opacity:.55;cursor:not-allowed;}
.mod-card.locked:hover{transform:none;border-color:var(--border);}
.mod-ic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.mod-meta{flex:1;min-width:0;}
.mod-name{font-size:15.5px;font-weight:600;letter-spacing:-.01em;}
.mod-sub{font-size:12.5px;color:var(--text3);margin-top:2px;}
.mod-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.mod-time{font-size:11px;color:var(--text3);}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:20px;padding:3px 9px;}
.pill.done{background:var(--green-bg);color:var(--green-text);}
.pill.active{background:var(--accent-soft);color:var(--accent-ink);}
.pill.locked{background:var(--bg4);color:var(--text3);}
.pill.blue{background:var(--blue-bg);color:var(--blue-text);}
.pill.amber{background:var(--amber-bg);color:var(--amber-text);}
.pill.red{background:var(--red-bg);color:var(--red-text);}
[data-theme="dark"] .pill.done{background:rgba(34,197,94,.18);color:#86e0a4;}
[data-theme="dark"] .pill.blue{background:rgba(59,130,246,.18);color:#93b8f6;}
[data-theme="dark"] .pill.amber{background:rgba(245,158,11,.18);color:#e7b765;}
[data-theme="dark"] .pill.red{background:rgba(239,68,68,.18);color:#f3a3a3;}

/* module reader */
.reader{background:var(--card-bg);border:.5px solid var(--border);border-radius:18px;padding:32px 38px;box-shadow:var(--shadow-sm);}
.reader h2{font-size:24px;font-weight:600;letter-spacing:-.03em;margin-bottom:4px;}
.reader .r-sub{color:var(--text2);font-size:14px;margin-bottom:22px;}
.reader h3{font-size:15px;font-weight:600;color:var(--accent-ink);margin:22px 0 8px;letter-spacing:-.01em;}
.reader p{font-size:14.5px;line-height:1.65;color:var(--text);margin-bottom:12px;}
.reader ul{margin:0 0 12px 4px;padding:0;list-style:none;}
.reader li{font-size:14.5px;line-height:1.6;color:var(--text);padding-left:20px;position:relative;margin-bottom:7px;}
.reader li:before{content:'';position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--accent);}
.reader b{font-weight:600;}
.checklist-section{margin-bottom:10px;border:.5px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card-bg);}
.checklist-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;transition:background .15s;}
.checklist-head:hover{background:var(--bg3);}
.checklist-head strong{font-size:14px;font-weight:600;}
.checklist-head svg{color:var(--text3);transition:transform .2s;flex-shrink:0;}
.checklist-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);background:var(--bg3);}
.checklist-body.open{max-height:3000px;}
.checklist-body-inner{padding:2px 16px 16px;}
.callout{display:flex;gap:11px;background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 16px;margin:16px 0;}
.callout .c-ic{color:var(--accent-ink);flex-shrink:0;font-size:15px;}
.callout .c-tx{font-size:14.5px;line-height:1.6;color:var(--text2);}
.callout.warn{border-left-color:var(--amber);}.callout.warn .c-ic{color:var(--amber);}
.callout.danger{border-left-color:var(--red);}.callout.danger .c-ic{color:var(--red);}
.callout.info{border-left-color:var(--blue);}.callout.info .c-ic{color:var(--blue);}
.reader-foot{display:flex;align-items:center;justify-content:space-between;margin-top:28px;padding-top:20px;border-top:.5px solid var(--border);}

/* quiz */
.qz-top{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.qz-prog{flex:1;height:7px;background:var(--bg4);border-radius:4px;overflow:hidden;}
.qz-prog span{display:block;height:100%;background:var(--accent);transition:width .3s;}
.qz-count{font-size:12px;color:var(--text3);font-weight:500;flex-shrink:0;}
.qz-q{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.4;margin-bottom:20px;}
.qz-opt{display:block;width:100%;text-align:left;background:var(--bg3);border:1.5px solid var(--border-strong);border-radius:12px;padding:15px 17px;font-size:14.5px;margin-bottom:11px;transition:all .15s;color:var(--text);}
.qz-opt:hover:not(:disabled){border-color:var(--accent);}
.qz-opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green-text);}
.qz-opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red-text);}
[data-theme="dark"] .qz-opt.correct{background:rgba(34,197,94,.14);color:#a7e8bd;}
[data-theme="dark"] .qz-opt.wrong{background:rgba(239,68,68,.14);color:#f3b0b0;}
.qz-opt:disabled{cursor:default;}
.qz-fb{border-radius:12px;padding:14px 16px;margin:6px 0 4px;font-size:13.5px;line-height:1.55;animation:fadeUp .25s ease both;}
.qz-fb.ok{background:var(--green-bg);color:var(--green-text);}.qz-fb.no{background:var(--red-bg);color:var(--red-text);}
[data-theme="dark"] .qz-fb.ok{background:rgba(34,197,94,.12);color:#a7e8bd;}[data-theme="dark"] .qz-fb.no{background:rgba(239,68,68,.12);color:#f3b0b0;}
.qz-fb b{font-weight:700;}
.qz-result{text-align:center;padding:20px 0;}
.qz-score{font-family:var(--font-num);font-weight:300;font-size:64px;line-height:1;letter-spacing:-.02em;}
.qz-score.pass{color:var(--green);}.qz-score.fail{color:var(--amber);}

/* kpi + panels (admin) */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:24px;}
.kpi{background:var(--card-bg);border:.5px solid var(--border);border-radius:16px;padding:18px 20px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;transition:box-shadow .22s;}
.kpi:hover{box-shadow:var(--shadow-md);}
.kpi-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}
.kpi-num{font-family:var(--font-num);font-weight:300;font-size:42px;line-height:1;letter-spacing:-.02em;text-align:right;}
.kpi-num small{font-size:18px;color:var(--text3);}
.kpi.accent .kpi-num{color:var(--accent-ink);}.kpi.green .kpi-num{color:var(--green);}.kpi.amber .kpi-num{color:var(--amber);}.kpi.blue .kpi-num{color:var(--blue);}
.kpi-foot{font-size:11px;color:var(--text3);text-align:right;margin-top:4px;}
.panel{background:var(--card-bg);border:.5px solid var(--border);border-radius:18px;padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;}
.panel-title{font-size:16px;font-weight:600;letter-spacing:-.02em;}
.panel-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;}
@media(max-width:900px){.panel-grid{grid-template-columns:1fr;}}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.tbl th{text-align:left;padding:9px 12px;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);border-bottom:.5px solid var(--border-strong);}
.tbl td{padding:11px 12px;border-bottom:.5px solid var(--border);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr.clickable{cursor:pointer;transition:background .15s;}
.tbl tr.clickable:hover td{background:var(--bg3);}
.mini-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;min-width:80px;}
.mini-bar span{display:block;height:100%;background:var(--accent);}
.cheat-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0;}
@media (max-width:640px){.cheat-cols{grid-template-columns:1fr;}}
.cheat-col{border-radius:12px;padding:12px 14px;font-size:13px;}
.cheat-col.always{background:rgba(34,197,94,.10);}
.cheat-col.never{background:rgba(239,68,68,.10);}
.cheat-col.reject{background:rgba(245,158,11,.10);}
.cheat-col h4{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
.cheat-col ul{margin:0;padding-left:16px;}
.cheat-col li{margin-bottom:5px;}
.cheat-col.always li,.cheat-col.always h4{color:#8FE0AE;}
.cheat-col.never li,.cheat-col.never h4{color:#F3A9A1;}
.cheat-col.reject li,.cheat-col.reject h4{color:#F3C877;}
[data-theme="light"] .cheat-col.always li,[data-theme="light"] .cheat-col.always h4{color:var(--green-text);}
[data-theme="light"] .cheat-col.never li,[data-theme="light"] .cheat-col.never h4{color:var(--red-text);}
[data-theme="light"] .cheat-col.reject li,[data-theme="light"] .cheat-col.reject h4{color:var(--amber-text);}
.tally-bar{display:flex;gap:16px;padding:12px 14px;background:var(--accent-soft);border-radius:12px;margin:10px 0;font-size:13px;flex-wrap:wrap;}
.tally-bar b{font-family:var(--font-num);font-weight:600;color:var(--accent-ink);}
.flag{font-size:11px;font-weight:600;color:var(--text2);}

.seg{display:inline-flex;gap:3px;background:var(--bg3);border:.5px solid var(--border);border-radius:11px;padding:3px;}
.locale-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.locale-chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--bg3);border:.5px solid var(--border-strong);color:var(--text2);transition:all .18s;}
.locale-chip:hover{background:var(--bg4);color:var(--text);}
.locale-chip.active{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent);}

.seg button{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);transition:all .18s;}
.seg button.active{background:var(--bg2);color:var(--text);font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.1);}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;animation:fade .2s ease;}
.modal{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--card-bg);border:.5px solid var(--border-strong);border-radius:18px;box-shadow:var(--shadow-lg);padding:26px;animation:fadeUp .3s ease both;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:19px;font-weight:600;letter-spacing:-.02em;}
.modal-close{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);}
.modal-close:hover{background:var(--bg3);}
.detail-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--border);font-size:13.5px;}
.detail-row:last-child{border-bottom:none;}
.detail-row .d-ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.d-ic.done{background:var(--green);color:#fff;}.d-ic.pend{background:var(--bg4);color:var(--text3);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);border-radius:14px;padding:12px 20px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:999;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.plain-ol{list-style-type:decimal;padding-left:22px;}.plain-ol li{margin-bottom:6px;padding-left:6px;}.plain-ol li:before{display:none;}
.shot{margin:16px 0;text-align:center;}
.shot img{max-width:100%;border-radius:10px;border:.5px solid var(--border-strong);box-shadow:var(--shadow-sm);}
.shot-cap{font-size:12px;color:var(--text3);margin-top:6px;font-style:italic;}
.reader h4{font-size:14px;font-weight:600;color:var(--text2);margin:18px 0 6px;letter-spacing:-.005em;}
.rec-stepper{display:inline-flex;align-items:center;background:var(--bg3);border:.5px solid var(--border-strong);border-radius:9px;overflow:hidden;}
.step-btn{width:28px;height:32px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--text2);transition:background .15s,color .15s;flex-shrink:0;}
.step-btn:hover{background:var(--accent-soft);color:var(--accent-ink);}
.step-btn:active{transform:scale(0.94);}
.step-val{width:46px;height:32px;text-align:center;background:transparent;border:none;border-left:.5px solid var(--border-strong);border-right:.5px solid var(--border-strong);color:var(--text);font-family:inherit;font-size:14px;-moz-appearance:textfield;}
.step-val::-webkit-outer-spin-button,.step-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.tracker-summary{display:flex;justify-content:space-between;align-items:center;background:var(--bg3);border-radius:12px;padding:14px 18px;margin:12px 0 16px;flex-wrap:wrap;gap:12px;}
.ts-block.right{text-align:right;}
.ts-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.ts-value{font-family:var(--font-num);font-size:26px;font-weight:700;}
.ts-value.accent{color:var(--accent-ink);}
.tmpl-box{margin:12px 0;}
.tmpl-label{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.tmpl-copy{background:var(--bg4);border:.5px solid var(--border-strong);color:var(--text2);font-size:11px;font-weight:600;padding:4px 10px;border-radius:7px;cursor:pointer;text-transform:none;letter-spacing:0;font-family:var(--font);}
.tmpl-copy:hover{border-color:var(--accent);color:var(--text);}
.script{background:var(--bg3);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;margin:0;font-style:italic;color:var(--text);font-size:14.5px;line-height:1.6;}
.rec-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:8px;}
.rec-table th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);padding:6px 4px;border-bottom:.5px solid var(--border-strong);}
.rec-table td{padding:8px 4px;border-bottom:.5px solid var(--border);}
.topic-trigger{background:var(--input-bg);border:.5px solid var(--border-strong);color:var(--text);font-size:12.5px;padding:7px 10px;border-radius:8px;min-width:150px;max-width:190px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;font-family:var(--font);text-align:left;transition:border-color .15s;}
.topic-trigger:hover{border-color:var(--accent);}
.topic-trigger-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topic-trigger svg{flex-shrink:0;color:var(--text3);}
.topic-menu-popup{position:fixed;z-index:900;background:var(--card-bg);border:.5px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;max-height:280px;overflow-y:auto;overflow-x:hidden;animation:fadeUp .15s ease both;}
.topic-menu-item{padding:9px 12px;border-radius:8px;font-size:13px;color:var(--text);cursor:pointer;white-space:normal;line-height:1.35;transition:background .12s;display:flex;align-items:flex-start;gap:8px;}
.topic-check{width:13px;flex-shrink:0;color:var(--accent-ink);font-weight:700;}
.topic-menu-item:hover{background:var(--accent-soft);}
.topic-menu-item.active{background:var(--accent-soft);color:var(--text);font-weight:600;}
.check-group{margin:10px 0 4px;}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:9px 0;cursor:pointer;font-size:14.5px;line-height:1.55;color:var(--text);border-bottom:.5px solid var(--border);}
.check-group .check-item:last-child{border-bottom:none;}
.check-item input[type=checkbox]{width:19px;height:19px;margin-top:1px;accent-color:var(--accent-ink);flex-shrink:0;cursor:pointer;}
.check-item span{flex:1;}
.check-item.done span{color:var(--text3);text-decoration:line-through;}
.chat-tmpl-table{border:.5px solid var(--border);border-radius:12px;overflow:hidden;margin:14px 0;}
.chat-tmpl-row{display:grid;grid-template-columns:1.2fr 1.6fr 0.8fr;gap:14px;padding:12px 16px;border-bottom:.5px solid var(--border);align-items:center;font-size:13.5px;}
.chat-tmpl-row:last-child{border-bottom:none;}
.chat-tmpl-row.head{background:var(--bg3);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);}
.chat-tmpl-row .send{font-style:italic;color:var(--text);}
@media(max-width:600px){.chat-tmpl-row{grid-template-columns:1fr;gap:4px;}.chat-tmpl-row.head{display:none;}.chat-tmpl-row span:first-child{font-weight:600;}.chat-tmpl-row span:last-child{color:var(--text3);font-size:12px;}}
@media(max-width:780px){.page-wrap{padding:0 16px;}.content{padding:0 0 24px;}.nav-brand span{display:none;}.reader{padding:24px 20px;}.panel-grid{grid-template-columns:1fr;}.app-header{padding:16px 0 14px;}.nav-tab{flex:none;}}
</style>

function shot(key,cap,maxw){return '<div class="shot"><img src="data:image/jpeg;base64,'+IMG[key]+'" style="max-width:'+(maxw||520)+'px" alt="'+cap.replace(/"/g,'')+'"><div class="shot-cap">'+cap+'</div></div>';}
const RTL_LOCALES=new Set(['he-IL']);
const LOCALE_EXAMPLES={
 // Default \u2014 shown to any moderator whose locale doesn't have dedicated examples yet.
 // Spanish-flavored, matches what the program already reviewed.
 'default':{
   intra:{line:'\u00bfPor qu\u00e9 te hicieron <b>sales representative</b>?',note:'Spanish, with an English noun phrase dropped in mid-sentence.'},
   inter:{line:'Estoy agotada hoy. <b>Anyway, let\u2019s talk tomorrow.</b>',note:'One full sentence in Spanish, the next entirely in English.'}
 },
 'es-ES':{
   intra:{line:'\u00bfPor qu\u00e9 te hicieron <b>sales representative</b>?',note:'Spanish (Spain), with an English noun phrase dropped in mid-sentence.'},
   inter:{line:'Estoy agotada hoy. <b>Anyway, let\u2019s talk tomorrow.</b>',note:'One full sentence in Spanish, the next entirely in English.'}
 }
 // Maple's other locales \u2014 nl-NL, he-IL, el-GR \u2014 don't have dedicated
 // examples yet. The program team confirms natural examples for each. Until
 // then, every moderator in one of those locales sees the default
 // (Spanish-flavored) examples above \u2014 nobody sees a blank or \"pending\" section.
};
function renderCodeswitchExamples(loc){
  const ex=LOCALE_EXAMPLES[loc]||LOCALE_EXAMPLES['default'];
  const rtl=RTL_LOCALES.has(loc);
  const dirAttr=rtl?' dir="rtl"':'';
  return `<ul><li><b>Intra-sentential \u2014 the pattern we require.</b> The switch happens <b>inside</b> a sentence or clause: <span${dirAttr}>"${ex.intra.line}"</span> ${ex.intra.note} Every valid recording needs some of this.</li><li><b>Inter-sentential \u2014 allowed, but not enough on its own.</b> One sentence in the primary language, the next in English: <span${dirAttr}>"${ex.inter.line}"</span> ${ex.inter.note}</li></ul>
   <div class="callout warn"><span class="c-ic">\u26A0</span><span class="c-tx">A conversation that only ever switches <i>between</i> sentences \u2014 never <i>within</i> one \u2014 does not meet the bar.</span></div>`;
}

// ---- Per-module inline quiz state ----
let MOD_QZ={qIdx:0, answers:{}, flagged:{}};

function modQuestions(id){return MOD_QUESTIONS[id]||[];}
function modQzComplete(id){const qs=modQuestions(id);if(!qs.length)return true;return qs.every((_,i)=>MOD_QZ.answers[id+'_'+i]!==undefined);}
function modQzScore(id){const qs=modQuestions(id);if(!qs.length)return null;const correct=qs.filter((q,i)=>MOD_QZ.answers[id+'_'+i]===q.a).length;return Math.round(correct/qs.length*100);}
function resetModQz(id){const qs=modQuestions(id);qs.forEach((_,i)=>{delete MOD_QZ.answers[id+'_'+i];delete MOD_QZ.flagged[id+'_'+i];});MOD_QZ.qIdx=0;}

function pickAnswer(id,qIdx,chosen){
  const qs=modQuestions(id); const q=qs[qIdx];
  if(MOD_QZ.answers[id+'_'+qIdx]!==undefined)return;
  MOD_QZ.answers[id+'_'+qIdx]=chosen;
  if(chosen!==q.a)MOD_QZ.flagged[id+'_'+qIdx]=true;

  // --- targeted DOM update (no scroll-resetting renderView) ---
  q.opts.forEach((_,k)=>{
    const btn=document.getElementById('mqzopt_'+id+'_'+qIdx+'_'+k);
    if(!btn)return;
    btn.disabled=true;
    btn.className='qz-opt'+(k===q.a?' correct':(k===chosen?' wrong':''));
  });
  const fb=document.getElementById('mqzfb_'+id+'_'+qIdx);
  if(fb&&chosen!==q.a){fb.className='qz-fb no';fb.innerHTML='<b>Not quite.</b> The correct answer is highlighted above.';}

  // update count + status + continue button
  const doneCount=qs.filter((_,i)=>MOD_QZ.answers[id+'_'+i]!==undefined).length;
  const cntEl=document.getElementById('mqzcnt_'+id);
  if(cntEl)cntEl.textContent=doneCount+'/'+qs.length+' answered';
  const allDone=modQzComplete(id);
  const statusEl=document.getElementById('mqzstatus_'+id);
  if(statusEl&&allDone){statusEl.style.color='var(--green)';statusEl.style.fontWeight='600';statusEl.textContent='\u2713 All questions answered \u2014 you can continue';}

  // unlock Continue button without re-rendering page
  if(allDone){
    const btns=[document.getElementById('mod-continue-btn')].filter(Boolean);
    btns.forEach(b=>{if(b.disabled){b.disabled=false;b.title='';b.textContent='Mark complete & continue \u2192';b.onclick=function(){completeModule();};}});
  }

  // auto-advance to next question (re-renders just the quiz card area via qzNav)
  if(qIdx<qs.length-1){setTimeout(()=>{MOD_QZ.qIdx=qIdx+1;_refreshQzCard(id);},900);}
  persistLocal();
}

function _refreshQzCard(id){
  // replaces only the quiz card, not the whole page — no scroll reset
  const card=document.querySelector('.reader [style*="margin:24px 0"]');
  if(card){const tmp=document.createElement('div');tmp.innerHTML=renderModQz(id);const newCard=tmp.firstElementChild;if(newCard)card.replaceWith(newCard);}
  else{renderView();} // fallback
}
function qzNav(id,dir){
  const qs=modQuestions(id);
  MOD_QZ.qIdx=Math.max(0,Math.min(qs.length-1,MOD_QZ.qIdx+dir));
  _refreshQzCard(id);
}

function renderModQz(id){
  const qs=modQuestions(id); if(!qs.length)return '';
  const idx=MOD_QZ.qIdx; const q=qs[idx];
  const answered=MOD_QZ.answers[id+'_'+idx]!==undefined;
  const chosen=MOD_QZ.answers[id+'_'+idx];
  const allDone=modQzComplete(id);
  const doneCount=qs.filter((_,i)=>MOD_QZ.answers[id+'_'+i]!==undefined).length;

  const opts=q.opts.map((o,k)=>{
    let cls='qz-opt';
    if(answered){if(k===q.a)cls+=' correct';else if(k===chosen)cls+=' wrong';}
    return `<button id="mqzopt_${id}_${idx}_${k}" class="${cls}" ${answered?'disabled':''} onclick="pickAnswer('${id}',${idx},${k})">${o}</button>`;
  }).join('');

  const fb=answered&&chosen!==q.a?`<div id="mqzfb_${id}_${idx}" class="qz-fb no"><b>Not quite.</b> The correct answer is highlighted above.</div>`
    :`<div id="mqzfb_${id}_${idx}"></div>`;
  const nav=`<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
    <button class="btn btn-secondary" style="padding:8px 14px;font-size:13px" ${idx===0?'disabled':''} onclick="qzNav('${id}',-1)">← Prev</button>
    <span id="mqzcnt_${id}" style="font-size:12px;color:var(--text3)">${doneCount}/${qs.length} answered</span>
    <button class="btn btn-secondary" style="padding:8px 14px;font-size:13px" ${idx===qs.length-1?'disabled':''} onclick="qzNav('${id}',1)">Next →</button>
  </div>`;
  const status=allDone?`<div id="mqzstatus_${id}" style="font-size:12px;font-weight:600;color:var(--green);margin-top:8px;text-align:center">\u2713 All questions answered — you can continue</div>`
    :`<div id="mqzstatus_${id}" style="font-size:12px;color:var(--text3);margin-top:8px;text-align:center">Answer all questions to continue</div>`;
  return `<div style="margin:24px 0;background:var(--bg3);border:.5px solid var(--border-strong);border-radius:14px;padding:18px 20px">
    <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px">Module check \u00b7 Question ${idx+1} of ${qs.length}</div>
    <div class="qz-q" style="font-size:16px;margin-bottom:14px">${q.q}</div>
    ${opts}${fb}${nav}${status}
  </div>`;
}
