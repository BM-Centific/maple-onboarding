 {id:'welcome',ic:'👋',title:'Welcome to Project Maple',sub:'What we\'re building and your role',min:5,type:'content',body:`
   <h3>What Maple is</h3>
   <p>Maple collects natural, everyday <b>conversations between bilingual speakers</b> who mix English into their primary language the way people really do — <b>code-switching</b>. These audio recordings train <b>speech-recognition (ASR) systems</b> to understand bilingual speakers the way they actually talk.</p>
   <h3>Your role as a moderator</h3>
   <p>You run remote recording sessions. In each session you'll:</p>
   <ul><li>Welcome two participants into an online recording room and get their audio working.</li><li>Guide a relaxed conversation so that natural code-switching happens — without ever telling people to switch.</li><li>Record several takes, then QA each one against a quality checklist.</li><li>Submit your verdicts and close the session out.</li></ul>
   <div class="callout"><span class="c-ic">◆</span><span class="c-tx">Sessions are <b>audio only</b> — there are no cameras. You'll never appear on the recording, and you steer largely through a one-way text chat.</span></div>
   <h3>How this onboarding works</h3>
   <p>Work through the modules below at your own pace, in your own timezone. At the end there's a short <b>knowledge check</b> — pass it and you're cleared to run real sessions. Keep the full <b>Session SOP</b> and <b>Topic & Prompt Bank</b> open as you go; they're your day-to-day references.</p>`},
 {id:'about_centific',ic:'🌐',title:'Who is Centific?',sub:'Who we are, and what your role is as a moderator',min:5,type:'content',body:`
   <h3>1. Who is Centific?</h3>
   <p>Centific is a global data and AI solutions company. We do not build the AI products you would recognize by name — we build the data those products learn from, which is why Centific is sometimes described as the hidden infrastructure behind AI models.</p>
   <p>Our clients are companies that build AI systems. They come to us because a model is only as good as the data it learned from, and good data doesn't exist by default — someone has to go create it, carefully, with real people. That's our job.</p>
   <p>What we provide to those clients:</p>
   <ul><li><b>Data creation and collection.</b> Speech, conversation, video, images, sensor data, and text — gathered in structured sessions like the ones you run.</li>
   <li><b>Human judgement and evaluation.</b> Experts review, rate, correct, and label AI output so systems learn what a good answer looks like.</li>
   <li><b>Language and cultural coverage.</b> Data work in 350+ languages and regional variants, so AI works for people outside a handful of major markets.</li>
   <li><b>Platforms and tooling.</b> The systems that manage all of the above at scale, including the tools you use to run and submit sessions.</li></ul>
   <p>The scale behind that: a network of over <b>1.8 million domain experts</b>, working across <b>230+ markets</b> and <b>50+ industries</b>. Centific's mission line is <i>"The Future Learns Here"</i> — literally: the data collected in your sessions is what the technology learns from.</p>
   <div class="callout warn"><span class="c-ic">⚠</span><span class="c-tx"><b>One rule that never changes:</b> we never disclose which client a project is for — not to participants, not to friends, not on social media. That confidentiality is part of Centific's agreement with every client, and part of your agreement with Centific.</span></div>
   <h3>2. What does the data collection team do?</h3>
   <p>The data collection team turns a client requirement into a finished, usable dataset. A client says, in effect, "our system fails to have natural conversation in this language" — the data collection team designs and runs the work that fixes it.</p>
   <ol class="plain-ol"><li><b>Define the spec.</b> What kind of speech or behavior is needed, in which languages, from which kinds of people, and what counts as acceptable quality.</li>
   <li><b>Recruit and consent participants.</b> Find people who match the profile, explain what they're agreeing to, and collect proper consent before anything is recorded.</li>
   <li><b>Schedule and prepare.</b> Match participants to sessions and moderators, confirm attendance, and make sure the tooling works before anyone joins.</li>
   <li><b>Run the sessions.</b> This is where you come in — moderators run the actual recordings to the project format.</li>
   <li><b>QA review.</b> Every recording is checked against the project quality standards. Sessions that miss the bar are flagged, returned, or rejected.</li>
   <li><b>Process and deliver.</b> Accepted sessions are transcribed, labelled, packaged into a dataset, and delivered to the client.</li></ol>
   <p>Two things worth understanding about how the team works:</p>
   <ul><li><b>Quality is the product, not volume.</b> A large pile of unusable recordings is worth nothing — the team is measured on how much data passes QA, not on how much was recorded.</li>
   <li><b>Every stage depends on the one before it.</b> A rejected session doesn't just cost one recording; it costs the participants' time, the recruiter's effort, and leaves a gap someone must fill again.</li></ul>
   <h3>3. What is the Moderator role?</h3>
   <p>You are the person who runs the session and is responsible for the data being usable. Every other stage of the pipeline is either preparing for your session or reacting to what you produced.</p>
   <p>What the role involves:</p>
   <ul><li><b>Prepare.</b> Check your equipment, environment, and the recording tool before the session starts.</li>
   <li><b>Hold the format.</b> Keep the session inside the project spec — the right structure, the right duration, the right requirements.</li>
   <li><b>Submit correctly and flag issues.</b> Follow the submission steps exactly, and tell your Project Manager about anything that went wrong — an honest flag is far cheaper than a surprise found in QA.</li></ul>
   <p>Just as important, what the role is <b>not</b>:</p>
   <ul><li>You are <b>not</b> an interviewer or researcher — the recorded material itself is the deliverable, not opinions or findings.</li>
   <li>You are <b>not</b> the QA reviewer — you apply first-line judgement, but flag it and let QA decide.</li>
   <li>You are <b>not</b> the client's representative — you represent Centific, and you cannot name the client.</li>
   <li>You are <b>not</b> expected to improvise policy — route anything you weren't briefed on to your Project Manager or the project email.</li></ul>
   <div class="callout"><span class="c-ic">✓</span><span class="c-tx"><b>The core of the job:</b> you're accountable for the quality of the data your sessions produce, and for representing Centific professionally throughout. The how-to for running a session day to day is covered in later modules — this one is about the company and the shape of the role.</span></div>
   <h3>Why we collect data — the honest answer</h3>
   <p>AI systems learn from examples. If the examples are narrow, the system is narrow. A speech system trained mostly on scripted, formal, standard-accent recordings does fine in a lab, then fails the moment it meets real, everyday speech — an accent, slang, two languages mixed mid-sentence, or background noise.</p>
   <p>That failure isn't abstract — it means a voice assistant doesn't understand someone, or an accessibility tool doesn't work for them, because people like them weren't in the training data.</p>
   <div class="callout"><span class="c-ic">ℹ</span><span class="c-tx"><b>Natural, unscripted human speech is genuinely hard to obtain.</b> It cannot be scraped or generated — it has to be collected, with consent, from real people who agree to take part. That's why this work exists, and why the quality of what you deliver matters.</span></div>`},
 {id:'codeswitch',ic:'🗣️',title:'Code-Switching, Up Close',sub:'The nuances that decide whether a recording counts',min:6,type:'content',body:`
   <h3>The two switching patterns</h3>
   {{CODESWITCH_EXAMPLES}}
   <h3>Code-switch vs. loanword \u2014 the distinction people miss</h3>
   <p>Not every English-looking word is a code-switch. A <b>loanword</b> is a foreign-origin word that has become a normal part of the primary language and is said the native way \u2014 it does <b>not</b> count.</p>
   <ul><li><b>Quick test:</b> would a one-language speaker of the primary language use this word normally, pronounced natively? Then it\u2019s a loanword (e.g. "computer", "f\u00fatbol", "karaoke", "week-end" in French). It doesn\u2019t count as switching.</li><li>If the speaker genuinely produces English \u2014 their own fluent pronunciation and grammar \u2014 <b>that</b> is a code-switch.</li></ul>
   <h3>The ratio, and what drives it</h3>
   <p>Aim for English at <b>~10\u201315%</b> of the conversation, measured after transcription and <b>spread throughout</b>. You never count live \u2014 you gauge and steer. <b>Topic drives the ratio:</b> Higher-tagged topics (work, technology, study/life abroad, pop culture) pull more English; Lower-tagged topics (family, food, home life) pull less.</p>
   <h3>Natural vs. forced \u2014 the line that decides validity</h3>
   <ul><li><b>Natural (valid):</b> spontaneous, the speaker\u2019s own fluent English, arising from what they\u2019re talking about.</li><li><b>Forced (rejected):</b> switching on cue, read from a list, halting or over-articulated, or in a put-on accent.</li></ul>
   <div class="callout"><span class="c-ic">\u25C6</span><span class="c-tx">Your job is to create the <b>conditions</b> for natural switching \u2014 topic and follow-ups \u2014 never to instruct it.</span></div>`},
 {id:'quality',ic:'🎯',title:'Recording Quality & the QA Bar',sub:'What every delivered recording must clear',min:6,type:'content',body:`
   <p>Every delivered recording has to clear a quality bar, and <b>failing any single item rejects it</b>. Think of it in two halves: is the <b>audio</b> usable, and is the <b>conversation</b> valid?</p>
   <h3>Audio quality — the foundation</h3>
   <ul><li>Quiet, intelligible audio, with <b>each speaker on their own isolated channel</b>.</li><li><b>Rejects:</b> noise, distortion, or dropout that makes speech hard to follow; a third-party voice that can’t be separated; persistent echo, reverb, or clipping; a speaker too quiet to follow; a channel that doesn’t isolate its speaker.</li><li><b>Not</b> rejects: a single unclear word or a brief noisy patch — those are handled downstream.</li></ul>
   <h3>Correct it, or reject it?</h3>
   <table class="tbl"><tr><th>Category</th><th>What to look for</th><th>Action</th></tr>
   <tr><td>Code-switching</td><td>Too little switching, or below the ratio</td><td>Reject</td></tr>
   <tr><td>Code-switching</td><td>Only isolated loanwords / brand names, or only between-sentence switching</td><td>Reject</td></tr>
   <tr><td>Code-switching</td><td>Forced or scripted, or halting / affected-accent English</td><td>Reject</td></tr>
   <tr><td>Naturalness</td><td>Reading, reciting, or rehearsed delivery; AI / synthetic / text-to-speech audio</td><td>Reject</td></tr>
   <tr><td>Naturalness</td><td>An imitated accent</td><td>Reject</td></tr>
   <tr><td>Conversation</td><td>A monologue, one speaker dominating, or very uneven participation</td><td>Reject</td></tr>
   <tr><td>Conversation</td><td>A silence longer than 6 seconds, or content that isn't a genuine back-and-forth</td><td>Reject</td></tr>
   <tr><td>Duration</td><td>Under 3 minutes, or over 30 minutes</td><td>Reject</td></tr>
   <tr><td>Content & compliance</td><td>Real personal identifiers, political/religious/violent/offensive material, or duplicate content</td><td>Reject</td></tr>
   <tr><td>Speakers</td><td>Primary language not at native level, English below the declared level, or more than two speakers</td><td>Reject</td></tr>
   </table>
   <h3>The 13-question QA checklist</h3>
   <p>Every delivered file gets checked against these 13 questions (Yes/No) before you can submit a verdict. You'll use this exact list during QA — it's also pinned in the Session Checklist tab for quick reference mid-session.</p>
   <ol class="plain-ol">
   <li>Is the recording free of garbled or distorted audio?</li>
   <li>Is the recording free of heavy background noise or non-participant voices?</li>
   <li>Is the conversation natural, without reading, reciting, or rehearsed speech?</li>
   <li>Is the conversation relatively balanced between the speakers?</li>
   <li>Is the code-switching natural without being cued or read from a list?</li>
   <li>Is the English natural, without excessive halting or artificial accents?</li>
   <li>Is the recording free of long segments (&gt;1 minute) with no English at all?</li>
   <li>Are there whole English phrases, not only isolated English words or brand names?</li>
   <li>Is there some code-switching within sentences?</li>
   <li>Is the conversation between 3 minutes and 30 minutes in length?</li>
   <li>Is the recording free of pauses longer than 6 seconds?</li>
   <li>Is the recording free of sensitive or personally identifiable information?</li>
   <li>Is the recording free of significant use of a third, non-target language?</li>
   </ol>
   <h3>Submitting your verdict</h3>
   <ul><li>All 13 items <b>Yes</b> unlocks <b>Pass</b> and <b>Weak Pass</b>. Use Weak Pass for usable but imperfect audio.</li>
   <li>A single <b>No</b> leaves only <b>Fail</b> — the tool won't let you pass the file.</li>
   <li>Submitted files become read-only and go to segmentation and a second QA pass by the team.</li></ul>
   <div class="callout warn"><span class="c-ic">⚠</span><span class="c-tx">When you're unsure, <b>re-record rather than pass</b>. A rejected file costs one take; a bad file that slips through costs the dataset.</span></div>
   <div class="callout"><span class="c-ic">ℹ</span><span class="c-tx">A speaker mismatch is different from a bad take — if someone’s primary-language level, English level, or demographics don’t match what was declared at recruitment, <b>cancel the session and log it in the Reschedule Log</b> (see the Running a Session module for the full steps) — don’t try to re-record around it.</span></div>`},
 {id:'tool',ic:'🛠️',title:'The OneForma Recording Tool',sub:'Access the tool, check your profile, and find your session',min:8,type:'content',body:`
   <p>Before you can run a session, get into the tool and confirm your own details are set up right.</p>

   <h3>1. Access the tool</h3>
   <p>Everything below happens in the Code-Switching Audio platform on OneForma. Open it now in another tab and follow along as you read.</p>
   <p style="text-align:center;margin:16px 0"><a href="https://apphub.oneforma.com/apps/code-switching-audio-moderator/console/my-assignments" target="_blank" rel="noopener" class="btn btn-primary" style="text-decoration:none;display:inline-block;padding:12px 26px">Open the Recording Tool ↗</a></p>
   <p>Sign in with your <b>Centific account</b>. This lands you on <b>My Board</b> — your home screen.</p>
   <div class="callout"><span class="c-ic">ℹ</span><span class="c-tx">Keep this link handy — it's the same one you'll use every time you sign in to run a session or update your profile.</span></div>

   <h3>2. Check your profile: language, availability & timezone</h3>
   <p>Before your first session, confirm your own details are correct. Go to <b>Operation → Moderators</b> and select yourself — you'll only ever see your own row here.</p>
   ${shot('op_moderators','Operation → Moderators, then select yourself.',260)}
   ${shot('moderator_list','The Moderator List — you’ll only ever see your own name here.',480)}
   <p>Your detail screen shows the <b>Languages</b> you're assigned to (your primary language → English) — check this matches what you were hired for — along with your <b>working hours</b>, <b>scheduling rules</b>, and <b>leave dates</b>.</p>
   ${shot('mod_detail','Your detail screen: check your Languages, then Working Hours, Scheduling Rules, and Leave Dates.',380)}
   <p>Click <b>Edit</b> on <b>Working Hours</b> to open the <b>Edit Working Hours</b> modal.</p>
   ${shot('edit_hours','Click Edit on Working Hours to set your hours.',400)}

   <h4>Setting your availability</h4>
   <p>In the Edit Working Hours modal, set your availability <b>per date</b> — you can add more than one time range per date if you need to, as long as the ranges don't overlap. Each time range has its <b>own time zone and language(s)</b> attached to it, so if you're assigned more than one language, select every language that time range should cover.</p>
   ${shot('edit_hours_modal','The Edit Working Hours modal — add one or more time ranges per date, each with its own time zone and language(s).',420)}
   <p>Click <b>Edit</b> on <b>Scheduling Rules</b> to set your <b>timezone</b> (and the session-gap duration).</p>
   ${shot('edit_timezone','Set your timezone (and session gap) in Scheduling Rules → Edit.',360)}
   <p>Add any <b>Leave Dates</b> you won't be working — this blocks that window so no session gets scheduled with you.</p>
   ${shot('leave_dates_modal','The Add Leave Dates modal.',320)}
   <p>You can also enter or review your availability directly from the <b>My Working Hours</b> dashboard — saving there generates or updates your future bookable slots from your availability; anything already booked is never changed. Check <b>My Working Hours</b> afterward to confirm the open slots match what you intended.</p>
   ${shot('my_working_hours','The “My Working Hours” dashboard — your entered availability and the resulting bookable slots.',480)}
   <div class="callout warn"><span class="c-ic">⚠</span><span class="c-tx"><b>Give at least 2 days’ notice</b> for any change to your availability, working hours, or leave dates. Changing them last-minute can leave a scheduled session without a moderator. Also double-check your timezone before your first session — a wrong timezone makes session start times look off.</span></div>

   <h3>3. Find your session on My Board</h3>
   <p>Back on <b>My Board</b>: <b>ACTIVE NOW</b> shows live sessions that need you in the room right now; <b>DEPARTURE BOARD</b> shows your upcoming planned sessions, soonest first.</p>
   ${shot('my_board','My Board when nothing is scheduled — you’ll see “Standing by.”',480)}
   ${shot('active_now','ACTIVE NOW — live sessions that need a moderator in the room.',480)}
   ${shot('departure_board','DEPARTURE BOARD — your planned sessions, soonest first.',480)}
   ${shot('session_card','A planned session shows a countdown to its start time — click Join room when it’s time.',300)}
   <div class="callout"><span class="c-ic">▶</span><span class="c-tx">Found your session? Head to the <b>Running a Session</b> module next for how to enter the room, record, QA, and close out.</span></div>`},
 {id:'session',ic:'🗂️',title:'Running a Session',sub:'Enter the room, record, QA, and close out — end to end',min:15,type:'content',body:`
   <h3>The flow, in order</h3>
   <ul><li><b>Join ~5 min early</b> and paste a welcome message in the chat so participants can read it as they get set up.</li><li><b>Confirm the roster</b> (two participants + you as MOD) and agree on the <b>names</b> everyone wants used — the alias they chose, or simply their first name.</li><li><b>Sound check</b> — confirm each person is clearly audible and can hear the other.</li><li><b>Brief them</b> on the task: a natural conversation, mixing in English, no script.</li><li><b>Practice takes</b> — at least two, and more if needed (see the gate below).</li><li><b>Record</b> the real takes.</li><li><b>QA</b> each recording against the checklist and submit Pass / Weak Pass / Fail.</li><li><b>End the call, then close the session.</b></li></ul>
   <h3>What you record</h3>
   <p>Maple's suggested session structure: <b>10 recordings per session</b>, each on a fresh topic, ranging from about <b>5 to 28 minutes</b> long. But the real target is the <b>~157 minutes of deliverable audio</b> — not the recording count. Use the breakdown below as a pacing guide, not a rigid script: you may end up with more or fewer recordings than listed, as long as the total gets there, plus orientation, practice, and feedback time (~3.5 hours all in).</p>
   <div class="tally-bar"><span>10 recordings</span><span>·</span><span><b>5–28 min</b> target, varies by recording</span><span>·</span><span><b>3 min</b> hard minimum</span><span>·</span><span><b>30 min</b> hard maximum</span></div>
   <table class="tbl"><tr><th>Segment</th><th>Practice (min)</th><th>Deliverable (min)</th><th>Feedback (min)</th></tr>
   <tr><td>Orientation</td><td>—</td><td>—</td><td>10</td></tr>
   <tr><td>Practice 1</td><td>5</td><td>—</td><td>—</td></tr>
   <tr><td>break/discuss</td><td>—</td><td>—</td><td>3</td></tr>
   <tr><td>Practice 2</td><td>5</td><td>—</td><td>—</td></tr>
   <tr><td>break/discuss</td><td>—</td><td>—</td><td>3</td></tr>
   <tr><td>Recording 1</td><td>—</td><td>10</td><td>—</td></tr>
   <tr><td>break/discuss</td><td>—</td><td>—</td><td>3</td></tr>
   <tr><td>Recording 2</td><td>—</td><td>10</td><td>—</td></tr>
   <tr><td>break/discuss</td><td>—</td><td>—</td><td>2</td></tr>
   <tr><td>Recording 3</td><td>—</td><td>20</td><td>—</td></tr>
   <tr><td>break/discuss</td><td>—</td><td>—</td><td>2</td></tr>
   <tr><td>Recording 4</td><td>—</td><td>28</td><td>—</td></tr>
   <tr><td>break/discuss</td><td>—</td><td>—</td><td>2</td></tr>
   <tr><td>Recording 5</td><td>—</td><td>20</td><td>—</td></tr>
   <tr><td>break/discuss</td><td>—</td><td>—</td><td>8</td></tr>
   <tr><td>Recording 6</td><td>—</td><td>28</td><td>—</td></tr>
   <tr><td>break/discuss</td><td>—</td><td>—</td><td>2</td></tr>
   <tr><td>Recording 7</td><td>—</td><td>10</td><td>—</td></tr>
   <tr><td>break/discuss</td><td>—</td><td>—</td><td>2</td></tr>
   <tr><td>Recording 8</td><td>—</td><td>20</td><td>—</td></tr>
   <tr><td>break/discuss</td><td>—</td><td>—</td><td>2</td></tr>
   <tr><td>Recording 9</td><td>—</td><td>6</td><td>—</td></tr>
   <tr><td>break/discuss</td><td>—</td><td>—</td><td>2</td></tr>
   <tr><td>Recording 10</td><td>—</td><td>5</td><td>—</td></tr>
   <tr><td>Closing</td><td>—</td><td>—</td><td>2</td></tr>
   <tr><td><b>Total</b></td><td><b>10</b></td><td><b>157</b></td><td><b>43</b></td></tr></table>
   <p class="callout" style="margin-top:0"><span class="c-ic">ℹ</span><span class="c-tx">This is a pacing guide, not a rigid script. If you fall behind, trim a break/discuss segment — never a recording.</span></p>
   <div class="callout"><span class="c-ic">🔒</span><span class="c-tx"><b>The practice gate:</b> don't start any real recording until you're confident both participants can code-switch naturally. Two practice takes is the minimum, not a cap.</span></div>

   <h3>1. Enter the room</h3>
   <p>It's an <b>audio-only voice call</b> — there are no cameras. You'll wait briefly on a connecting screen while the room loads.</p>
   ${shot('connecting','The connecting screen — participants waiting to join.',480)}
   <p>Once connected, you'll see both participants and yourself (carrying the <b>MOD</b> tag).</p>
   ${shot('connected_room','Connected with 2 participants — your icon carries the MOD tag.',480)}
   <p>Your controls are <b>MUTE</b>, <b>REC TIME</b>, <b>RECORD</b>, and <b>END</b>.</p>
   ${shot('controls','Your controls: MUTE, REC TIME, RECORD, END.',300)}
   <h4>Using the chat</h4>
   <p>The chat is <b>one-way</b> — only you can send; participants read your messages on their screen. Use it to greet people, share instructions, and steer without unmuting.</p>
   ${shot('chat_use','Use the chat to communicate with participants without unmuting during recording.',320)}
   <div class="callout"><span class="c-ic">ℹ</span><span class="c-tx">If a participant can't be heard, their browser may be asking for microphone permission — this is what they'll see. Guide them to <b>Allow</b>, or have them leave and rejoin to re-sync it.</span></div>
   ${shot('mic_prompt','What a participant sees if their browser asks for microphone access.',260)}

   <h3>2. Record the conversation takes</h3>
   <ol><li>Set the scene and topic. Once participants are ready, <b>mute yourself</b>, then click <b>RECORD</b>. Clicking it asks you to confirm before recording actually starts.</li>
   <li>Tell participants via chat to click <b>REC TIME</b> on their end too, so they see the timer.</li>
   <li>Watch <b>REC TIME</b> in the corner to track the length of the take — each recording has its own target length per the session structure above (5–28 min); hard bounds for any recording are <b>3–30 minutes</b>.</li>
   <li>Click <b>STOP</b> to end the take.</li></ol>
   ${shot('record_confirm','Clicking RECORD asks you to confirm before recording starts.',330)}
   ${shot('rec_counter','REC counts up in the corner while recording is live.',480)}
   <p>The take saves to <b>Media Files</b> as a <b>Draft</b> — it can take a few minutes to appear.</p>
   ${shot('draft_saved','After you stop, the take saves to Media Files as a Draft.',480)}
   <div class="callout info"><span class="c-ic">💡</span><span class="c-tx">Since files don't appear (or become taggable) right away, it's easy to lose track of which topic(s) went with which take by the time you sit down to QA. The <b>Session Checklist</b>'s recording tracker has a <b>Topic discussed</b> menu for exactly this — select every topic that came up (a conversation often covers more than one) right after each take, so you have it to go off of during QA instead of relying on memory.</span></div>
   <div class="callout warn"><span class="c-ic">⚠</span><span class="c-tx"><b>Never speak during a take.</b> Your voice on a participant's channel is grounds for rejection — stop the take first if you must step in.</span></div>

   <h3>3. QA each recording</h3>
   <p>Once your recording target is met, you can let participants leave while you QA — no need to keep them waiting.</p>
   ${shot('media_files','The Media Files list — Draft recordings are the ones waiting on your QA.',420)}
   <p>Click play to open <b>Recording Review</b>, where you can play, scrub, and adjust playback speed.</p>
   ${shot('qa_review_open','Recording Review — play, scrub, and change playback speed.',420)}
   <p>Tag every <b>Conversation Topic</b> the pair actually discussed (use "No Preference" if a topic isn't listed), then answer all <b>13 checklist questions</b> (Yes / No).</p>
   ${shot('conv_topics','Tag the Conversation Topics — choose “No Preference” if the topic isn’t listed.',380)}
   ${shot('qa_checklist1','The QA checklist (Mark All Yes / Clear All) — screenshot shows only a partial view.',380)}
   <div class="callout"><span class="c-ic">ℹ</span><span class="c-tx">All 13 QA questions are listed in full in the <b>Session Checklist</b> (in this app) or the <b>Session SOP</b> — the screenshot above shows only a partial view, not all 13 questions.</span></div>

   <h3>4. Submit your verdict</h3>
   <p>All items <b>Yes</b> unlocks <b>Pass</b> and <b>Weak Pass</b> — choose Weak Pass for usable but imperfect audio. A single <b>No</b> leaves only <b>Fail</b>.</p>
   ${shot('pass_weakpass','All Yes unlocks Pass and Weak Pass.',280)}
   ${shot('fail','A single No leaves only Fail.',280)}
   <p>Repeat for every Draft file, then review the summary and submit.</p>
   ${shot('review_submit','Review & Submit shows a summary of your verdicts — anything still marked Draft must be QA’d first.',380)}

   <h3>5. Close out the session</h3>
   <p>Click <b>END</b> — this removes participants from the recording room.</p>
   ${shot('end_call','Click END to end the call (this releases participants).',280)}
   <p>Then go to <b>Operation → Sessions</b>, open the session, scroll to <b>Actions</b>, and click <b>Close Session</b>.</p>
   ${shot('operation_sessions','Go to Operation → Sessions.',260)}
   ${shot('close_session','Open the session, scroll to Actions, and click Close Session.',380)}
   <div class="callout warn"><span class="c-ic">⚠</span><span class="c-tx">Never skip this. An open session keeps the status as “In progress” and holds up reporting.</span></div>
   <h3>If a session can't be completed</h3>
   <p>Sometimes a session can't go forward — most commonly, one participant is fine but the other doesn't speak the language natively and can't record, or a participant simply doesn't show. This is different from a conduct or safety escalation (see the Professional Conduct module) — here, it's fine to tell participants directly what's happening.</p>
   <ol class="plain-ol">
   <li>Tell participants politely that the session can't continue today — don't diagnose the reason aloud, just close it out kindly.</li>
   <li>Go to <b>Operation → Sessions</b>, open the session, and click <b>Cancel Session</b> (not Close Session — the session never completed).</li>
   <li>Fill out the <b>Reschedule Log</b> the same day, under Resources, noting which participant needs to be rescheduled and why.</li>
   </ol>
   <div class="callout"><span class="c-ic">💬</span><span class="c-tx"><i>"Thank you both for your time today — unfortunately we're not able to continue the session right now. This isn't anything either of you did wrong, and we'll get things sorted on our end. Take care!"</i></span></div>
   <div class="callout info"><span class="c-ic">ℹ</span><span class="c-tx">You only ever see participant <b>aliases</b> in the recording tool — never real names, emails, or phone numbers. Use the alias exactly as shown when you log it. The internal team reviews the log and handles the actual rescheduling — you don't need to contact participants yourself.</span></div>
   <h3>Quick-reference cheat sheet</h3>
   <div class="cheat-cols">
   <div class="cheat-col always"><h4>Always</h4><ul>
   <li>Stay off the delivered track (muted during takes)</li>
   <li>Set the topic, then let them talk</li>
   <li>Steer with topics &amp; follow-ups</li>
   <li>Track the ~10–15% English mix</li>
   <li>Confirm names (alias or first name only); keep full names &amp; 3rd languages off</li>
   <li>QA every Draft file the same day</li>
   <li>Close the session every time</li>
   </ul></div>
   <div class="cheat-col never"><h4>Never</h4><ul>
   <li>Say "say that in English"</li>
   <li>Hand out English word lists</li>
   <li>Speak during a take</li>
   <li>Accept imitated accents</li>
   <li>Let unintelligible audio pass</li>
   <li>Quote or negotiate a rate</li>
   </ul></div>
   <div class="cheat-col reject"><h4>Reject / fail if</h4><ul>
   <li>Under 3 min or over 30 min</li>
   <li>Scripted or forced switching</li>
   <li>Only inter-sentential, ever</li>
   <li>Mono / non-isolated channel</li>
   <li>Real personal details surface</li>
   <li>Any unintelligible stretch</li>
   </ul></div>
   </div>`},
 {id:'technique',ic:'🎚️',title:'Moderating for Natural Switching',sub:'Steer it — and when to stop vs. nudge',min:5,type:'content',body:`
   <h3>You're a facilitator, not an interviewer</h3>
   <p>Natural switching comes from <b>topic and setting</b>, never from instruction. Pick topics that pull English out (work, tech, study abroad, pop culture) and ask follow-ups that invite opinions and explanations.</p>
   <h3>The target ratio</h3>
   <p>Aim for English at roughly <b>10–15% of the conversation</b>, measured after transcription — not something you count live. Gauge it roughly as you listen, and look for English <b>recurring throughout</b> the take rather than clustered at one point.</p>
   <h3>How to steer — Higher vs. Lower topics</h3>
   <ul><li><b>Higher-tagged topics</b> (work, technology, study/life abroad, pop culture) pull more English out naturally.</li><li><b>Lower-tagged topics</b> (family, food, reflection) pull less — use these to bring the ratio down if a take is running English-heavy.</li><li><b>Directed follow-ups:</b> steer toward English-heavy subject matter — specific work tools, streaming platforms, professional processes — to draw English out organically.</li><li><b>Between-take adjustment:</b> if a take stayed mostly in the primary language, nudge the next take's topic or follow-ups toward a Higher-tagged one.</li><li><b>Coaching, the right way:</b> between takes or in practice, you may read a natural-switching example from the Topic Bank aloud. Never supply a word list.</li></ul>
   <h3>Never do this</h3>
   <ul><li>Say "say that in English" or cue a switch.</li><li>Hand participants a list of English words to insert.</li><li>Accept scripted, read-aloud, or affected-accent switching (in either language).</li></ul>
   <h3>Speaker balance</h3>
   <p>If one speaker starts to dominate, correct it <b>between takes</b> — direct the next follow-up to the quieter speaker <b>by name</b> at the start of the next take, rather than interrupting mid-take.</p>
   <h3>Content protection</h3>
   <p>If real personal identifiers or sensitive content surface, <b>stop the take and re-record</b>. More than incidental use of a third language (beyond the primary language + English pair) is also a violation — send a chat pointer first; if it continues, stop and re-record.</p>
   <h3>When to stop vs. when to nudge</h3>
   <table class="tbl"><tr><th>Situation</th><th>Nudge (chat pointer, keep going)</th><th>Stop and re-record</th></tr>
   <tr><td>No English for about a minute</td><td>Steer the next follow-up toward an English-heavy angle</td><td>—</td></tr>
   <tr><td>Only isolated words, no phrases</td><td>Steer follow-ups toward opinions or explanations</td><td>—</td></tr>
   <tr><td>Only inter-sentential switching</td><td>Introduce a follow-up that invites a mid-sentence reaction</td><td>—</td></tr>
   <tr><td>One speaker dominating</td><td>Direct a follow-up to the quieter speaker by name</td><td>Only if it persists after two nudges</td></tr>
   <tr><td>Drifting toward real full names</td><td>"First name or alias only, please"</td><td>If it continues beyond one reminder</td></tr>
   <tr><td>Brief other-language word</td><td>Chat pointer to return to primary language + English</td><td>If it continues beyond incidental use</td></tr>
   <tr><td>Sounds recited or formal</td><td>"Relax — just chat"</td><td>If it stays scripted after the reminder</td></tr>
   <tr><td>Real personal detail surfaces</td><td>—</td><td>Always — no nudge option here</td></tr>
   <tr><td>Forced or scripted switching (cued or read from a list)</td><td>—</td><td>Always — no nudge option here</td></tr>
   <tr><td>Unclear/garbled audio, or a take under 3 min</td><td>—</td><td>Always — no nudge option here</td></tr>
   </table>`},
 {id:'walkthrough',ic:'🎬',title:'Watch: Full Session Walkthrough',sub:'A complete session, demonstrated end to end',min:55,type:'content',body:`
   <h3>Your session walkthrough</h3>
   <p>This is a guided demo of a complete session in the OneForma tool — joining and briefing, recording takes, QA, and closing out. It's meant to be watched <b>hand-in-hand with the Session SOP</b>: the modules here teach the concepts, and this shows you the click-by-click flow in the real tool. Keep the SOP open and follow along.</p>
   <div class="callout"><span class="c-ic">ℹ</span><span class="c-tx">The video below refers to this document as the "Moderator SOP" — it's the same document, just renamed to <b>Session SOP</b> since it was recorded. Look for that name under Resources.</span></div>
   <div class="callout warn"><span class="c-ic">⚠</span><span class="c-tx">This video is somewhat outdated — for the current click-by-click flow, refer to the <b>OneForma Moderator Tooling Guide</b> under Resources, especially for: <b>entering your availability/working hours</b>, <b>checking which slots have opened for you</b>, and <b>understanding which slots are available for participants to book</b>.</span></div>
   <div style="position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;border:.5px solid var(--border);background:#000;margin:14px 0">
     <iframe src="https://digitaltechedge.sharepoint.com/sites/Code-Switching_Collection_Moderators/_layouts/15/embed.aspx?UniqueId=b5cf2a7d-03d6-48af-8077-fee7319cee82" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen title="Maple session walkthrough"></iframe>
   </div>
   <div class="callout"><span class="c-ic">▶</span><span class="c-tx">Signed in with your Centific account, the recording plays above. If it doesn’t load, <a href="https://digitaltechedge.sharepoint.com/:v:/r/sites/Code-Switching_Collection_Moderators/Shared%20Documents/Video%20Walkthroughs/Project%20Juniper%20-%20Moderator%20SOP%20_%20Tooling%20Guide-20260804_194821-Meeting%20Recording.mp4?d=wb5cf2a7d03d648af8077fee7319cee82&amp;csf=1&amp;web=1&amp;e=LwmzDy" target="_blank" rel="noopener" style="color:var(--accent-ink);font-weight:600">open it in SharePoint ↗</a>.</span></div>`},
 {id:'privacy',ic:'🔐',title:'Privacy & Professional Conduct',sub:'Names, PII, and handling participants',min:4,type:'content',body:`
   <h3>Names keep it anonymous</h3>
   <p>Participants sign up with either the <b>alias they chose</b> or simply <b>their first name only</b> — no full names, ever — and never see each other's real full identity. Confirm what each wants to be called, and remind everyone not to say <b>full names, locations, workplaces, or other personal details</b> on the recording — real identifiers fail QA.</p>
   <h3>Handling questions</h3>
   <ul><li><b>Too many questions:</b> answer briefly, then redirect to the conversation.</li><li><b>Rate / payment:</b> don't quote or negotiate — point them to the job posting.</li><li><b>Data / privacy:</b> refer them to the consent they signed; don't answer yourself.</li></ul>
   <h3>Conduct</h3>
   <ul><li>Be respectful and calm; give feedback only between takes.</li><li>Stay muted during takes — your voice on a channel is a rejection.</li></ul>
   <div class="callout"><span class="c-ic">✓</span><span class="c-tx">Next up: the <b>knowledge check</b>. It pulls from everything above — pass it and you're cleared for production.</span></div>`},
 
 {id:'rep_centific',ic:'🏢',title:'Representing Centific',sub:'How you show up — in sessions, in chat, and everywhere else',min:8,type:'content',body:`
   <p>For most participants, you are the only Centific person they will ever meet. Their entire impression of this company is you, on a screen, for two to three hours.</p>
   <p>Watch the walkthrough below for how Centific branding and professionalism show up in practice.</p>
   <div style="position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;border:.5px solid var(--border);background:#000;margin:14px 0">
     <iframe src="https://digitaltechedge.sharepoint.com/sites/Code-Switching_Collection_Moderators/_layouts/15/embed.aspx?UniqueId=eea1166e-a2d3-497b-849e-e4adcb117ed7" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen title="Moderator Fundamentals - Centific Branding"></iframe>
   </div>
   <div class="callout"><span class="c-ic">▶</span><span class="c-tx">Signed in with your Centific account, the walkthrough plays above. If it doesn't load, <a href="https://digitaltechedge.sharepoint.com/:v:/r/sites/Code-Switching_Collection_Moderators/Shared%20Documents/Video%20Walkthroughs/Moderator%20Fundamentals%20-%20Centific%20Branding.mp4?d=weea1166ea2d3497b849ee4adcb117ed7&amp;csf=1&amp;web=1&amp;e=7sOcnI" target="_blank" rel="noopener" style="color:var(--accent-ink);font-weight:600">open it in SharePoint ↗</a>.</span></div>

   <h3>Setting the tone</h3>
   <p>You can't shake hands, and there's no video in this tool — participants only ever hear you. Signal professionalism through what you say and how you show up:</p>
   <ul><li><b>Introduce yourself by name</b> and as a Centific moderator.</li>
   <li><b>Join the room before your participants do.</b> Never make them wait in an empty room.</li>
   <li><b>Speak clearly and warmly</b> — your voice is the only impression they get of you.</li>
   <li><b>Stay professional in the chat.</b> It's the only other channel you have, and it's retained.</li></ul>

   <h3>Introducing yourself</h3>
   <p>Use your <b>real first name</b>, and open with a line like this:</p>
   <div class="callout"><span class="c-ic">&#x201C;</span><span class="c-tx"><i>"Hi, I'm [name]. I'll be moderating this data capture session on behalf of Centific."</i></span></div>
   <p><b>"On behalf of Centific"</b> is the right phrasing, and it matters — you work <b>with</b> Centific, not <b>for</b> Centific. Your agency is your employer, and describing it any other way is inaccurate — Module 9 covers this fully. Participants are using an alias or their first name only; you are not. This is deliberate: you are the accountable professional in the room, and participants are protected contributors.</p>

   <h3>The client is confidential</h3>
   <p>You do not name the client to participants. You do not describe their industry. You do not speculate about what the data will be used for. If a participant asks who the client is:</p>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>Centific runs data collection for a range of partners, and the specific partner is confidential.</i></span></div>
   <p>You'll work through scripts covering exactly what to say in these situations in a later module.</p>

   <h3>Every channel, not just live sessions</h3>
   <p>You represent Centific in OneForma, in Centific email, and in MS Teams. The same professional standard applies when you're posting a question in a moderator channel at 11pm as when you're on a call with participants.</p>`},

 {id:'rep_expectations',ic:'📋',title:'Setting Expectations with Participants',sub:'Brief them fully before the first recording — it makes everything easier',min:6,type:'content',body:`
   <p>Setting expectations before you capture anything is the highest-leverage thing you do all session. An informed participant performs better, needs fewer retakes, and leaves satisfied.</p>

   <h3>Lay out the roadmap</h3>
   <p>Before the first recording, walk both participants through the shape of the session so nothing comes as a surprise:</p>
   <ol class="plain-ol"><li>We'll do a couple of practice runs first. These aren't kept; they exist so you get comfortable.</li>
   <li>Then ten separate recordings on different topics, ranging from about 5 to 28 minutes each — some short, some long.</li>
   <li>Altogether the recordings add up to a bit over two and a half hours of conversation.</li>
   <li>Between recordings I may ask us to redo one. That's normal and it's never a comment on you.</li></ol>

   <h3>What you can — and can't — describe</h3>
   <p>You can describe what happens in the session: they'll have normal conversations, the audio is recorded, unscripted and relaxed matters more than being "correct." For Maple you can say that naturally mixing English into the conversation is welcome. <b>You never instruct them to switch languages, and you never mention a ratio.</b></p>

   <h3>What the participant leaves with</h3>
   <p>By the end, every participant should know:</p>
   <ul><li>Their recordings were submitted successfully.</li>
   <li>When and how they'll be paid (see below).</li>
   <li>Who to contact afterward: <b>prod_code_switching@centific.com</b></li>
   <li>That they won't receive or review copies of the recordings.</li></ul>
   <p><b>Thank them explicitly, by name, at the close.</b> They've given you two to three hours of unscripted personal conversation. That contribution matters — say so.</p>

   <h3>Participant payment — what you may tell them</h3>
   <ul><li><b>Basis:</b> paid per session.</li>
   <li><b>Full rate:</b> if they stay for the entire session.</li>
   <li><b>If they drop early:</b> prorated to actual recording time completed. Practice takes don't count if they drop early.</li>
   <li><b>Method:</b> Tremendous.</li>
   <li><b>Timing:</b> 5 business days after the session completes.</li>
   <li><b>Terms:</b> per the agreement signed at OneForma registration.</li></ul>
   <p>You are empowered to state these facts. You are not responsible for managing payment. Answer the question, then route anything further to <b>prod_code_switching@centific.com</b>. <b>Never quote a figure, never promise an exact deposit date, never offer to chase a payment personally.</b></p>`},

 {id:'rep_comms',ic:'💬',title:'Communicating During the Session',sub:'Staying muted, using chat, and steering the conversation',min:8,type:'content',body:`
   <p><b>Your voice is not the data. Theirs is.</b></p>
   <p>While a take is running, you stay muted. The recording is two participants talking to each other — your voice on will necessitate a retake. Everything you say aloud happens <i>between</i> takes.</p>

   <h3>You speak English — always</h3>
   <p>Whatever language the session is recorded in, and whatever your locale assignment, you address participants in English. Your locale assignment is for matching and tracking, not for setting the language you speak. When someone struggles to follow, you never switch languages. Instead:</p>
   <ol class="plain-ol"><li><b>Put it in the chat.</b> Written English is easier to process than spoken English for most non-native readers, and the message stays on screen so they can re-read it.</li>
   <li><b>Rephrase, don't repeat.</b> Saying the same sentence more slowly rarely helps. Say a simpler, different sentence.</li>
   <li><b>One idea per sentence.</b></li>
   <li><b>Check by asking them to say it back</b> — not "does that make sense?" which almost everyone answers yes to regardless.</li></ol>

   <h3>The text chat</h3>
   <p><b>One-way.</b> You can send to one participant or both. They cannot reply to you, and they cannot use it to reach each other. Each participant has their own private thread — they can't see what you sent the other person. Messages persist and are kept — write knowing a message sent in the first ten minutes is still readable two hours later.</p>
   <div class="callout warn"><span class="c-ic">\u26A0</span><span class="c-tx"><b>Three rules for the chat:</b><br>1. 500 characters is a ceiling, not a target — roughly ten words. If you need more, stop the take and speak.<br>2. Don't stack corrections — three corrections to the same person means stop the take and talk.<br>3. Never type a participant's real full name. If someone slips, send: <i>"First name or alias only, please"</i> — never type the name to correct it.</span></div>

   <h3>Steering the conversation</h3>
   <p>You're not a passive recorder. Track who's dominating, when energy flags, when a topic has run dry. Move before the recording suffers. If a participant looks uncertain or answers as though they misheard, stop and restate. A confused participant produces an unusable take.</p>
   <p>When unsure, re-record. A rejected file costs one take. A bad file that slips through costs the dataset.</p>`},

 {id:'scripts_journey',ic:'📜',title:'Scripts: The Participant Journey',sub:'Ready-to-use scripts for common situations — welcome to close',min:8,type:'content',body:`
   <p>These scripts cover the most common situations you'll encounter. Use the exact words or adapt them — but make sure every key point is covered.</p>
   <div style="position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;border:.5px solid var(--border);background:#000;margin:14px 0">
     <iframe src="https://digitaltechedge.sharepoint.com/sites/Code-Switching_Collection_Moderators/_layouts/15/embed.aspx?UniqueId=59f61ded-88d8-4ac9-917e-80383b7f262b" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen title="Moderator Fundamentals - Participant Experience Scenarios"></iframe>
   </div>
   <div class="callout"><span class="c-ic">▶</span><span class="c-tx">Signed in with your Centific account, the walkthrough plays above. If it doesn't load, <a href="https://digitaltechedge.sharepoint.com/:v:/r/sites/Code-Switching_Collection_Moderators/Shared%20Documents/Video%20Walkthroughs/Moderator%20Fundamentals%20-%20PT%20Experience%20Scenarios.mp4?d=w59f61ded88d84ac9917e80383b7f262b&amp;csf=1&amp;web=1&amp;e=XZGcBD" target="_blank" rel="noopener" style="color:var(--accent-ink);font-weight:600">open it in SharePoint ↗</a>.</span></div>

   <h3>4.1 · Welcoming a nervous participant</h3>
   <p><i>Situation: a participant joins sounding anxious — they've never done this.</i></p>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"You're in exactly the right place — welcome. I'm [name], and I'll be with you both the whole way. There's no such thing as getting this wrong. We'll do some practice runs first that nobody keeps, so by the time we're actually recording it'll already feel familiar."</i></span></div>
   <p><b>If they press — "what if I say something wrong?"</b></p>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"There's nothing to get wrong. We're interested in how people actually talk to each other. Not performing, just chatting. And we can stop and go again any time."</i></span></div>
   <p style="color:var(--text3);font-size:13px"><b>Don't:</b> start setup with no reassurance · pressure a hesitant participant · hint at the client.</p>

   <h3>4.2 · Orienting an unprepared participant</h3>
   <p><i>Situation: a participant admits they didn't read the welcome materials.</i></p>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"No problem at all. Here's the short version: you two are going to have some normal conversations while I record the audio. That's genuinely it. We'll warm up with a few practice runs I don't keep, then record about ten separate conversations on different topics — some shorter, some longer — adding up to around two and a half hours of conversation total. I'll suggest topics as we go. You don't need anything prepared."</i></span></div>
   <p>Before you record, confirm they completed registration and consent at OneForma. If anything is outstanding, don't start the session — route them to <b>prod_code_switching@centific.com</b>.</p>
   <p style="color:var(--text3);font-size:13px"><b>Don't:</b> make them feel judged · describe client specifications or ratios · skip the roadmap because you're behind.</p>

   <h3>4.3 · Adapting for language level or accessibility needs</h3>
   <p><i>Situation: a participant genuinely struggles to follow you, or has an accessibility need.</i></p>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"Let's slow right down. I'll say it again a different way — stop me any time, there's no rush at all."</i></span></div>
   <p>Then work the toolkit from the Communicating During Sessions module: chat first, rephrase, shorten, confirm by asking them to say it back. <b>Don't switch to their language</b>, even if you speak it.</p>
   <p style="color:var(--text3);font-size:13px"><b>Note:</b> if someone genuinely cannot follow English at the level declared at recruitment, that's Script 4.5, not this.</p>

   <h3>4.4 · Payment questions before the session</h3>
   <p><i>Situation: a participant asks how and when they'll be paid.</i></p>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"You're paid per session, through Tremendous, about five business days after we finish today. It's all in the agreement you signed when you registered. Stay for the full session and you get the full session rate."</i></span></div>
   <p style="color:var(--text3);font-size:13px"><b>Don't:</b> quote a figure · promise an exact deposit date · take on responsibility for chasing a problem.</p>

   <h3>4.5 · Speaker mismatch</h3>
   <p><i>Situation: mid-session, a participant's language level or demographics don't match what they declared.</i></p>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"Let me pause us here for a moment — I want to check something on my end."</i></span></div>
   <p>Then close the session courteously, without diagnosing the mismatch to them. A speaker mismatch is not a bad take — don't record around it. Cancel the session and update the <b>Reschedule Log</b> (under Resources) the same day, so the internal team can get the participant booked again.</p>

   <h3>4.6 · Payment questions after the session</h3>
   <p><i>Situation: the session is done and a participant asks when the money arrives.</i></p>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"Five business days, through Tremendous. If it hasn't landed after that, email <b>prod_code_switching@centific.com</b> and they'll chase it. That's not something I can do from my end, but they can."</i></span></div>
   <p>Read their payment email back to confirm the spelling — it's cheap and prevents an entire category of problem.</p>

   <h3>4.7 · A participant asks who Centific is</h3>
   <p><i>Situation: a participant asks what Centific is, or who they're really working for.</i></p>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"Centific is a global data and AI company. We collect real human speech and behavior so that AI systems learn to understand real people — not just textbook examples. Your session becomes part of the training material that teaches those systems."</i></span></div>
   <p style="color:var(--text3);font-size:13px"><b>Don't:</b> name the client · speculate about what the data will be used for beyond this · make promises about future products.</p>`},

 {id:'scripts_pressure',ic:'🚧',title:'Scripts: Pressure & Boundaries',sub:'What to say when things get difficult',min:9,type:'content',body:`
   <h3>5.1 · Questions about the client or data use</h3>
   <p><i>Situation: a participant asks who's behind this, how their recordings will be used, or who sees them.</i></p>
   <div class="callout"><span class="c-ic">&#x201C;</span><span class="c-tx"><i>"Fair question, and I'm not able to name the company. How the recordings get used and who has access to them is all set out in the consent form you signed when you registered, so that's the best place to look. If you want more detail than what's in there, email DC_Project_US@centific.com and they'll answer it properly."</i></span></div>
   <p>You do not need to restate the terms of the consent form, and you do not need to explain what the client needs the data for. The participant already has the document that answers this, and the DC email covers anything it doesn't.</p>
   <p style="color:var(--text3);font-size:13px"><b>Don't:</b> name or guess at the client · restate or interpret the consent form · volunteer explanations of what the client wants the data for.</p>
   <h3>5.2 · Technical problems and waiting</h3>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"Sorry about the wait — that's on our end, not yours, and I appreciate your patience. Nothing you did caused it."</i><br><br><i>"This doesn't cost you anything. As long as we get through the session, you're paid the full session rate. Troubleshooting doesn't count against you."</i></span></div>
   <p style="color:var(--text3);font-size:13px"><b>Don't:</b> get defensive · offer compensation to smooth it over · push ahead when quality is compromised.</p>

   <h3>5.3 · Mid-take intervention — text or stop</h3>
   <p>Decide which tool fits. Text can steer; it cannot explain and it cannot ask a question. If a situation requires more than ~10 words — stop the take.</p>
   <ul><li><b>One person dominating:</b> "Let [name] take the next turn" → to that speaker only</li>
   <li><b>Someone gone quiet:</b> "Jump in whenever — no rush" → to that speaker only</li>
   <li><b>Drifting toward real full names:</b> "First name or alias only, please" → to that speaker only</li>
   <li><b>Energy flagging:</b> "Try: [topic]" → both</li>
   <li><b>Sounds recited or formal:</b> "Relax — just chat" → both</li>
   <li><b>Long silence:</b> "Keep going, this is good" → both</li></ul>
   <p><b>When to stop instead of text:</b> doorbell, alarm, third voice, anything that will fail QA — stop first, then explain:</p>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"Let's grab that one again — I picked up some background noise. Nothing to do with the conversation, that was going really well. Let's pick up around where you were talking about [topic]."</i></span></div>

   <h3>5.4 · A participant wants to stop</h3>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"Absolutely. You can stop at any time, and that's completely okay. No explanation needed."</i></span></div>
   <p>If they ask about payment: <i>"It's based on the recording time we actually completed, so it'd be prorated rather than the full session rate. For exactly what that works out to, <b>prod_code_switching@centific.com</b> is the right place. But please don't let that change what you decide. If you want to stop, we stop."</i></p>
   <p><b>Never use payment as an argument for staying.</b> If they don't ask about pay, don't raise it.</p>

   <h3>5.5 · A participant negotiates scope</h3>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"I hear you. Let's keep it moving. Each conversation is part of what makes this usable, so I can't drop them. But I can keep us efficient, and we can take a short break whenever you want."</i></span></div>
   <p>And the distinction that matters: <i>"If something feels uncomfortable rather than just long, tell me. That's different, and we can pause or stop."</i></p>
   <p style="color:var(--text3);font-size:13px"><b>Don't:</b> agree to cut takes · frame it as "no pay unless you finish" (coercive).</p>

   <h3>5.6 · A participant asks to hear the recording</h3>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"I totally understand wanting to; most people ask. I'm not able to play anything back; the recordings go straight into a secure workflow and aren't reviewed here."</i><br><br>If they ask whether it's a privacy thing: <i>"Exactly that. How it's stored is spelled out in the form you signed, and DC_Project_US@centific.com can answer anything beyond that."</i></span></div>

   <h3>5.7 · The environment isn't workable</h3>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx"><i>"I'm picking up some noise on your end. Is there somewhere quieter you could move to? It doesn't need to be perfect, just somewhere the microphone isn't competing."</i><br><br>If a third person is present: <i>"I need to check — is anyone else in the room with you? For privacy reasons we need it to be just the two of you on the recording."</i></span></div>
   <p style="color:var(--text3);font-size:13px"><b>Don't:</b> push ahead hoping it'll be fine · let a third party remain audible.</p>

   <h3>5.8 · A participant appears intoxicated</h3>
   <div class="callout warn"><span class="c-ic">\u26A0</span><span class="c-tx"><i>"We're not going to be able to continue today. I'm going to end the session here. Take care, both of you."</i><br><br>Then end the call. Don't explain, don't debate, don't discuss payment, don't offer to reschedule.</span></div>
   <p>Before ending, send the other participant a private chat: <i>"Nothing to do with you at all — apologies for the short session. Someone will follow up."</i></p>
   <p>Escalate to <span style="background:var(--amber-bg);color:var(--amber-text);font-weight:700;padding:1px 6px;border-radius:4px;font-size:13px">your Project Manager</span> immediately after. Describe behavior, never conclusions — never use the words "drunk" or "intoxicated" in your escalation.</p>

   <h3>5.9 · Inappropriate conduct toward you</h3>
   <div class="callout"><span class="c-ic">\u201c</span><span class="c-tx">Redirect once, firmly: <i>"I'm here in a professional capacity, so let's keep our focus on the session. Back to it — [topic]."</i><br><br>If it continues: <i>"I need us to keep this professional. If that's not workable, I'll end the session here."</i><br><br>Then end it if needed, with the same private note as 5.8.</span></div>
   <p>Escalate to <span style="background:var(--amber-bg);color:var(--amber-text);font-weight:700;padding:1px 6px;border-radius:4px;font-size:13px">your Project Manager</span> same day. Your comfort outranks finishing the session.</p>`},

 {id:'contacts_full',ic:'📞',title:'Who to Contact',sub:'Your contacts, where to route participants, and when to escalate',min:5,type:'content',body:`
   <h3>Your contacts</h3>
   <ul><li><b>Maple — process, scheduling, sessions:</b> Milica Novakovic, Senior Project Manager — milica.novakovic@centific.com</li>
   <li><b>Training material, this training app, OneForma, and tooling questions:</b> Bhargav, Project Coordinator — bhargavsai.m@centific.com</li>
   <li><b>Samay timesheet and PID assignments:</b> Akiko Yeckley, Operations Manager — akiko.yeckley@centific.com (backup: Amy Johns — amy.johns@centific.com)</li>
   <li><b>Participant conduct questions:</b> Drew Sowers, Senior Quality Lead — andrew.sowers@centific.com</li>
   <li><b>Your rate, bonuses, raises, or future work:</b> Your agency — Centific cannot answer these. See Module 9.</li></ul>

   <h3>Where to route participants</h3>
   <ul><li><b>Consent form, data use, withdrawal, deleting recordings:</b> DC_Project_US@centific.com</li>
   <li><b>Payment timing, amount, or problems:</b> <b>prod_code_switching@centific.com</b></li>
   <li><b>Scheduling or rebooking:</b> <b>prod_code_switching@centific.com</b></li></ul>
   <p>You route these. You don't answer them. That isn't a brush-off — it's how participants get accurate answers instead of your best guess.</p>

   <h3>During a live session</h3>
   <p>Use <b>MS Teams</b>. The team watches Teams during sessions. Email won't be seen in time.</p>

   <h3>Escalation tiers</h3>
   <ul><li><b>Handle yourself:</b> routine session flow, everything the scripts cover, normal rescheduling.</li>
   <li><b>Flag in real time (Teams):</b> anything you can't resolve safely — a participant who appears intoxicated, an unworkable environment, a safety concern, inappropriate conduct toward you, a participant in visible distress.</li>
   <li><b>Report afterward:</b> resolved but leadership must know — a cancelled or cut-short session, a withdrawal request, a scope dispute, any participant complaint. Same day.</li>
   <li><b>Escalate immediately:</b> legal, privacy, or safety-of-others weight — a lost recording, a demand touching the consent form, an allegation of misconduct, harm or threat of harm. Notify your Project Manager and don't try to resolve it yourself.</li></ul>`},

 {id:'centific_works',ic:'🤝',title:'How Centific Works With You',sub:'Your agency employs you. Centific directs the work. Here’s why that matters.',min:5,type:'content',body:`
   <p><b>You work with Centific. Your agency employs you.</b> Those are two different relationships, and keeping them clear protects you as much as it protects us.</p>
   <p>Centific directs the moderation work: what the sessions need, how the data is captured, and what good quality looks like. Your agency is your employer — they hold your contract, they pay you, and they handle everything about your terms of work. <b>You are not a Centific employee.</b> That is not a comment on your value. It is the shape of the arrangement.</p>

   <h3>What Centific provides</h3>
   <ul><li>The client’s guidelines and the quality standards your work is measured against</li>
   <li>Access to the data collection tools, recording room, and this app</li>
   <li>Your Centific email and access to project systems</li>
   <li>Training and onboarding, including this course</li>
   <li>Direct communication with your Project Manager and project leads</li>
   <li>Session scheduling through OneForma</li>
   <li>Support during live sessions — there is always someone to reach when something goes wrong</li></ul>
   <p><i>If it’s about doing the work, Centific is the right place to ask.</i></p>

   <h3>What your agency handles</h3>
   <ul><li>Your pay and your rate</li>
   <li>Your contract and the hours you’re engaged for</li>
   <li>Time off, benefits, and taxes</li>
   <li>Whether there is more work after this project ends</li></ul>
   <p><i>If it’s about your employment, your agency is the right place to ask — and the only place that can give you a real answer.</i></p>

   <h3>What Centific cannot do for you</h3>
   <ul><li>Change your rate, your hours, or your terms</li>
   <li>Approve a bonus or negotiate more hours</li>
   <li>Promise a permanent role or guarantee future projects</li>
   <li>Include you in benefits or events for Centific employees</li></ul>
   <p>If you raise these, your Project Manager will point you back to your agency. That is not a brush-off — they have no authority over your terms.</p>

   <h3>How to describe this work</h3>
   <p>You are a moderator <b>working with Centific</b>, not <b>working for Centific</b>.</p>
   <ul><li><b>To participants:</b> introduce yourself as moderating on behalf of Centific (Module 2). Your Centific email starts with <b>v-</b> — it marks you as working through a vendor rather than as staff.</li>
   <li><b>On LinkedIn or your CV:</b> list your agency as your employer. Example: <i>[Agency name] · Data Collection Moderator — Conducted data collection moderation sessions on behalf of Centific.</i> Do not list Centific as your employer.</li></ul>
   <div class="callout"><span class="c-ic">◆</span><span class="c-tx">The professional standard is exactly the same regardless of how you are contracted. How you communicate, how you treat participants, and how you represent this work do not change. You are held to the same bar as anyone at Centific.</span></div>`},
 {id:'hours_pay',ic:'💰',title:'Working at Centific — Hours & Pay',sub:'Logging your time and how payment works',min:5,type:'content',body:`
   <h3>When your paid time started</h3>
   <p>The qualification assessment you completed in OneForma was <b>not paid</b>. This onboarding training <b>is</b>. From the moment you reached this app, your time counts — log your onboarding hours in Samay against your project's PID (see <b>Your timesheet</b> below).</p>
   <p>Your PID for live session work is the same one — reach out to Akiko Yeckley (backup: Amy Johns) if it changes or you're unsure which one to use.</p>
   <div class="callout warn"><span class="c-ic">⚠</span><span class="c-tx">Your Samay hours become your paycheck. Late or missing entries delay your own payment. Log daily.</span></div>

   <h3>Key dates in Samay</h3>
   <p>These are shown on the Samay home screen — check them each pay period:</p>
   <ul><li><b>Prelim cutoff date:</b> the auto-approval date for the month. After this date, you can no longer submit a new time entry for that period — you'll need to submit an adjustment instead.</li>
   <li><b>Final cutoff date:</b> the auto-approval date for adjustment requests.</li></ul>
   <div class="callout warn"><span class="c-ic">⚠</span><span class="c-tx"><b>Holidays are not paid.</b> Submit only your actual working hours on a holiday date, and disregard the default 8-hour entry Samay may pre-fill for that day.</span></div>
   <div class="callout"><span class="c-ic">ℹ</span><span class="c-tx"><b>Don't worry about exceeding your expected hours.</b> Submit your actual hours worked, even if that's more than what was expected for the period.</span></div>

   <h3>Your timesheet</h3>
   <p><b>How to log in:</b></p>
   <ol><li>Go to <a href="https://timesheet.centific.com/#/login" target="_blank" rel="noopener" style="color:var(--accent-ink);font-weight:600">timesheet.centific.com/#/login ↗</a>.</li>
   <li>Click <b>Login by SSO</b>.</li>
   <li>Use your Centific <b>v-</b> email and password — the same Moderator email Centific IT sent you in your welcome letter.</li></ol>
   <p>Reference the walkthrough below for the click-by-click flow, including how to log both your onboarding and working hours.</p>
   <div style="position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;border:.5px solid var(--border);background:#000;margin:14px 0">

   Mirrors Pine's persistLocal/loadLocal pattern: quiz answers, checklist
   ticks, and recording-tracker entries are cached per moderator email so
   a reload mid-session doesn't wipe them out. Real progress (which
   modules are done) stays cloud-first via the Progress table -- this is

function sessionKeyFor(email){return 'maple_v1_session_'+String(email||'').toLowerCase();}
function persistLocal(){
 if(!ME.email)return;
 try{
  localStorage.setItem(sessionKeyFor(ME.email),JSON.stringify({
   modQz:MOD_QZ,checklistOpen,checklistChecks,recDurations,recTopics,recTargets:REC_TARGETS,
   theme:document.documentElement.getAttribute('data-theme')
  }));
 }catch(e){console.warn('[Maple] persist failed:',e.message);}
}
function loadLocalSession(email){
 try{const raw=localStorage.getItem(sessionKeyFor(email));return raw?JSON.parse(raw):null;}
 catch(e){return null;}
}
function restoreLocalSession(email){
 const saved=loadLocalSession(email);
 if(!saved)return;
 if(saved.modQz)MOD_QZ=saved.modQz;
 if(saved.checklistOpen)checklistOpen=saved.checklistOpen;
 if(saved.checklistChecks)checklistChecks=saved.checklistChecks;
 if(saved.recDurations)recDurations=saved.recDurations;
 if(saved.recTopics)recTopics=saved.recTopics;
 if(saved.recTargets)REC_TARGETS=saved.recTargets;
 if(saved.theme)document.documentElement.setAttribute('data-theme',saved.theme);
}

/* ===================== CUSTOM TOPIC DROPDOWN =====================
   Native <select> option lists can't be reliably themed or rounded
   across browsers/OSes (confirmed: color-scheme helps pick light vs
   dark, but the popup itself stays native chrome, unrounded, and
   sometimes ignores the page theme entirely). This is a real custom
   popup instead: a themed trigger button + a position:fixed popup
   appended to <body> (so it escapes the table's overflow-x:auto
   clipping), positioned off the trigger's own bounding rect after
   every render. Closes on click-outside or on selecting an item. */
let _topicMenuOpenFor=null;
function toggleTopicMenu(key,ev){
 ev.stopPropagation();
 _topicMenuOpenFor=(_topicMenuOpenFor===key)?null:key;
 renderView();
}
function toggleTopicChoice(key,topic){
 let arr=(recTopics[key]||[]).slice();
 const has=arr.includes(topic);
 if(topic==='No preference'){
  arr=has?[]:['No preference'];
 }else{
  arr=arr.filter(t=>t!=='No preference'); // picking a real topic drops the "No preference" catch-all
  arr=has?arr.filter(t=>t!==topic):[...arr,topic];
 }
 recTopics[key]=arr;
 persistLocal();
 renderView(); // menu stays open -- positionTopicMenu() (called at the end of renderView) rebuilds it with the new checks
}
function positionTopicMenu(){
 let popup=document.getElementById('topicMenuPopup');
 if(_topicMenuOpenFor===null){if(popup)popup.remove();return;}
 const trigger=document.querySelector('[data-topic-key="'+_topicMenuOpenFor+'"]');
 if(!trigger){if(popup)popup.remove();_topicMenuOpenFor=null;return;}
 if(!popup){popup=document.createElement('div');popup.id='topicMenuPopup';popup.className='topic-menu-popup';document.body.appendChild(popup);}
 const current=recTopics[_topicMenuOpenFor]||[];
 popup.innerHTML=RECORDING_TOPICS.map(t=>{const checked=current.includes(t);return `<div class="topic-menu-item${checked?' active':''}" onclick="toggleTopicChoice('${_topicMenuOpenFor}','${t}')"><span class="topic-check">${checked?'✓':''}</span>${t}</div>`;}).join('');
 const rect=trigger.getBoundingClientRect();
 const width=Math.max(rect.width,190);
 popup.style.width=width+'px';
 popup.style.top=(rect.bottom+6)+'px';
 popup.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-width-8))+'px';
}
document.addEventListener('click',function(e){
 if(_topicMenuOpenFor!==null&&!e.target.closest('.topic-menu-popup')&&!e.target.closest('.topic-trigger')){
  _topicMenuOpenFor=null;

 }
});

 const prevBtn=CUR_MOD>0?`<button class="btn btn-secondary btn-lg" onclick="prevModule()">← Previous module</button>`:'';
 let bodyHtml=m.body;
 if(m.id==='codeswitch'){bodyHtml=bodyHtml.replace('{{CODESWITCH_EXAMPLES}}',renderCodeswitchExamples(ME.loc));}
 const qzHtml=renderModQz(m.id);
 const qzDone=modQzComplete(m.id);
 const alreadyDone=ME.done.has(m.id);
 const canContinue=alreadyDone||qzDone;
 const isLastModule=CUR_MOD===MODULES.length-1;
 const continueBtn=canContinue
  ?`<button class="btn btn-primary btn-lg" onclick="completeModule()">${alreadyDone?'Continue →':(isLastModule?'Finish':'Mark complete & continue →')}</button>`
  :`<button id="mod-continue-btn" class="btn btn-primary btn-lg" disabled title="Answer all module questions to continue">Answer questions to continue</button>`;
 return `<button class="btn btn-secondary" style="margin-bottom:18px" onclick="go('path')">← Back to path</button>
  <div class="reader"><div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px">Module ${CUR_MOD+1} of ${MODULES.length} · ${m.min} min</div>
  <h2>${m.title}</h2><div class="r-sub">${m.sub}</div>${bodyHtml}${qzHtml}
  <div class="reader-foot"><span class="page-sub">${alreadyDone?'✓ You\'ve completed this module':qzDone?'All questions answered — mark it complete':'Read through and answer the module questions'}</span>
  <div style="display:flex;gap:10px">${prevBtn}${continueBtn}</div></div></div>`;
}
function prevModule(){if(CUR_MOD>0){CUR_MOD--;MOD_QZ.qIdx=0;renderNavTabs();renderView();window.scrollTo(0,0);}}
function completeModule(){const m=MODULES[CUR_MOD];ME.done.add(m.id);saveProgress(m.id,'done',null);
 const sc=modQzScore(m.id);if(sc!==null){saveProgress(m.id+'_quiz','done',sc);}
 MOD_QZ.qIdx=0;
 // advance to next available module, or back to path
 const next=CUR_MOD+1;
 if(next<MODULES.length){CUR_MOD=next;VIEW='module';toast('Module complete ✓');renderNavTabs();renderView();window.scrollTo(0,0);}
 else{VIEW='path';renderNavTabs();renderView();window.scrollTo(0,0);toast('All modules complete — welcome to Project Maple.');}
}
