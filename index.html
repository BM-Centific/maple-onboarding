let recDurations={};
const RECORDING_TOPICS=['Daily Life & Routines','Food & Eating','Work & Study','Technology & Media','Travel & Culture','Health & Wellness','Shopping & Services','Hobbies & Free Time','Relationships & Social Life','Self & Identity','Current Events & Opinions','Home & Living','Family & Parenting','Science & Curiosity','No preference'];
let recTopics={}; // { rowIndex: [topicString,...] } -- lets a moderator jot down what was actually discussed per recording (a take can cover more than one topic), since Media Files entries don't appear/tag-able immediately; this is their own memory aid for QA later, not a submission to OneForma itself
function adjustRec(idx,delta){
 const cur=recDurations[idx]||0;
 recDurations[idx]=Math.max(0,Math.round((cur+delta)*10)/10);
 persistLocal();
 renderView();
}
function setRecMinutes(idx,val){
 const n=Math.max(0,parseFloat(val)||0);
 recDurations[idx]=Math.round(n*10)/10;
 persistLocal();
 renderView();
}
function resetRecTotals(){recDurations={};checklistChecks={};recTopics={};REC_TARGETS=[...BASE_REC_TARGETS];persistLocal();renderView();}
function addExtraRecording(){
 const total=Object.values(recDurations).reduce((a,b)=>a+(b||0),0);
 const remaining=Math.max(0,REC_TARGET_TOTAL-total);
 const remainingCount=REC_TARGETS.filter((t,i)=>!recDurations[i]).length;
 const suggested=Math.min(30,Math.max(3,remainingCount>0?remaining/(remainingCount+1):10));
 REC_TARGETS.push(Math.round(suggested));
 persistLocal();
 renderView();
}
function buildRecTable(){
 const total=Object.values(recDurations).reduce((a,b)=>a+(b||0),0);
 const remaining=Math.max(0,REC_TARGET_TOTAL-total);
 const remainingCount=REC_TARGETS.filter((t,i)=>!recDurations[i]).length;
 // Anchor "needed" to each remaining recording's OWN suggested target from the
 // structure, only nudging it by however far actual entries have drifted from
 // plan so far — rather than flattening the whole remaining pot evenly, which
 // ignores the structure entirely and was the earlier (wrong) behavior.
 const variance=REC_TARGETS.reduce((sum,t,i)=>recDurations[i]?sum+(recDurations[i]-t):sum,0);
 const adjustment=remainingCount>0?-variance/remainingCount:0;
 const rows=REC_TARGETS.map((t,i)=>{
  const val=recDurations[i]||0;
  const filled=!!recDurations[i];
  const neededVal=Math.min(30,Math.max(3,t+adjustment));
  const neededCell=filled?`<span style="color:var(--text3)">✓</span>`:`<span style="color:var(--accent-ink);font-weight:600">~${Math.round(neededVal)} min</span>`;
  const topicArr=recTopics[i]||[];
  const topicLabel=topicArr.length===0?'Select…':topicArr.length===1?topicArr[0]:topicArr.length+' topics';
  return `<tr><td style="font-weight:600">${i+1}</td><td style="color:var(--text3)">~${t} min</td><td>
   <div class="rec-stepper">
     <button type="button" class="step-btn" aria-label="Decrease minutes" onclick="adjustRec(${i},-0.5)">−</button>
     <input type="number" class="step-val" min="0" step="0.5" value="${val||''}" placeholder="0" onchange="setRecMinutes(${i},this.value)">
     <button type="button" class="step-btn" aria-label="Increase minutes" onclick="adjustRec(${i},0.5)">+</button>
   </div>
  </td><td>${neededCell}</td><td><button type="button" class="topic-trigger" data-topic-key="${i}" onclick="toggleTopicMenu(${i},event)"><span class="topic-trigger-label"${topicArr.length?'':' style="color:var(--text3)"'}>${topicLabel}</span><svg width="11" height="11" viewBox="0 0 18 18" fill="none"><path d="M4.5 6.75L9 11.25L13.5 6.75" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></td></tr>`;
 }).join('');
 const varianceLabel=variance<-0.05?`<span style="color:var(--red)">−${Math.round(Math.abs(variance)*10)/10} min short so far</span>`
   :variance>0.05?`<span style="color:var(--green)">+${Math.round(variance*10)/10} min extra so far</span>`
   :`<span style="color:var(--text3)">On target so far</span>`;
 return `<div class="tracker-summary">
   <div class="ts-block"><div class="ts-label">Recorded so far</div><div class="ts-value accent">${Math.round(total*10)/10} min</div></div>
   <div class="ts-block right"><div class="ts-label">Remaining (target ~${REC_TARGET_TOTAL} min)</div><div class="ts-value" style="color:${remaining<=0?'var(--green)':'var(--text)'}">${Math.round(remaining*10)/10} min</div></div>
 </div>
 <div class="callout" style="margin-top:0"><span class="c-ic">ℹ</span><span class="c-tx"><b>Vs. each recording's own target so far:</b> ${varianceLabel} — a negative number means shortfall to make up in what's left. A positive number means buffer: keep recording at full target length and you'll end up with extra deliverable audio (more is generally better), or trim upcoming recordings by roughly that much combined if you're pressed for time — you don't need to use the whole buffer just because it's there.</span></div>
 <div style="overflow-x:auto"><table class="rec-table"><tr><th style="width:34px">#</th><th>Target</th><th>Actual (min)</th><th>Needed</th><th>Topic discussed</th></tr>${rows}</table></div>
 <div style="margin-top:10px"><button type="button" class="btn btn-secondary" onclick="addExtraRecording()">+ Add another recording</button></div>
 <p style="font-size:12.5px;color:var(--text3);margin-top:8px">The rows above are a <b>suggested</b> breakdown of the ~${REC_TARGET_TOTAL}-min target — in practice you may land on more or fewer recordings than listed, as long as the total gets there. <b>Needed</b> recalculates live off each row's own suggested length (clamped to this program's 3–30 min hard bounds), nudged by how far you've drifted from plan — use it to pace, not as a new fixed target. If you need more recordings than planned, click <b>Add another recording</b> above rather than trying to force the total into fewer, longer takes.</p>
 <p style="font-size:12.5px;color:var(--text3);margin-top:0"><b>Topic discussed</b> is just for you — select every topic that came up in the take (a conversation often covers more than one). Files don't appear in Media Files (or become taggable) right away, so jotting these down as you go means you're not relying on memory when you get to QA at the end of the session. This selection isn't submitted anywhere; use the real Conversation Topics field in the tool when you QA each file.</p>`;
}

 return `<div class="page-head"><div><div class="page-title">Resources</div><div class="page-sub">Your reference library — opens in SharePoint (Centific sign-in)</div></div></div>
  ${rescheduleCard}
  ${items.map(it=>`<a class="mod-card" style="margin-bottom:12px;text-decoration:none;color:inherit" href="${it[3]}" target="_blank" rel="noopener"><div class="mod-ic">${it[0]}</div><div class="mod-meta"><div class="mod-name">${it[1]}</div><div class="mod-sub">${it[2]}</div></div><div class="mod-right"><span class="pill blue">Open ↗</span></div></a>`).join('')}`;
}

/* ===================== ADMIN: DASHBOARD ===================== */
function cohortStats(){const s={not_started:0,in_progress:0,quiz_failed:0,certified:0};COHORT.forEach(m=>s[m.status]++);return s;}
function vDash(){const s=cohortStats();const total=COHORT.length;
 const locales=Array.from(new Set(COHORT.map(m=>m.loc))).sort();
 let list=COHORT.map((m,i)=>({...m,i}));
 if(COHORT_FILTER==='attention')list=list.filter(m=>m.status==='quiz_failed');
 else if(COHORT_FILTER==='active')list=list.filter(m=>m.status==='in_progress');
 else if(COHORT_FILTER==='certified')list=list.filter(m=>m.status==='certified');
 if(LOCALE_FILTER!=='all')list=list.filter(m=>m.loc===LOCALE_FILTER);
 const localeChips=`<div class="locale-chips">
   <button class="locale-chip ${LOCALE_FILTER==='all'?'active':''}" onclick="setLocaleFilter('all')">All locales · ${total}</button>
   ${locales.map(loc=>{const n=COHORT.filter(m=>m.loc===loc).length;return `<button class="locale-chip ${LOCALE_FILTER===loc?'active':''}" onclick="setLocaleFilter('${loc}')">${loc} · ${n}</button>`;}).join('')}
 </div>`;
 const rows=list.map(m=>{const pct=Math.round(m.done/MODULES.length*100);const sl=STAGE_LABEL[m.status];
   return `<tr class="clickable" onclick="modDetail(${m.i})"><td><div style="display:flex;align-items:center;gap:10px"><span class="user-av" style="background:var(--accent)">${m.name[0]}</span><div><div style="font-weight:600">${m.name}</div><div style="font-size:11px;color:var(--text3)">${m.loc} · ${m.tz}</div></div></div></td>
   <td style="min-width:130px"><div style="display:flex;align-items:center;gap:8px"><div class="mini-bar" style="flex:1"><span style="width:${pct}%"></span></div><span style="font-size:12px;color:var(--text3)">${m.done}/${MODULES.length}</span></div></td>
   <td>${m.score!=null?`<b>${m.score}%</b>`:'<span style="color:var(--text3)">—</span>'}</td>
   <td><span class="pill ${sl[1]}">${sl[0]}</span></td>
   <td style="color:var(--text3);font-size:12px">${m.active}</td></tr>`;}).join('');
 return `<div class="page-head"><div><div class="page-title">Cohort Dashboard</div><div class="page-sub">${total} moderators across ${locales.length} locales · onboarding progress at a glance</div></div></div>
  <div class="kpi-grid">
   <div class="kpi accent"><div class="kpi-label">Enrolled</div><div class="kpi-num">${total}</div><div class="kpi-foot">in onboarding</div></div>
   <div class="kpi blue"><div class="kpi-label">In progress</div><div class="kpi-num">${s.in_progress}</div><div class="kpi-foot">working through it</div></div>
   <div class="kpi green"><div class="kpi-label">Certified</div><div class="kpi-num">${s.certified}</div><div class="kpi-foot">cleared for production</div></div>
   <div class="kpi amber"><div class="kpi-label">Needs attention</div><div class="kpi-num">${s.quiz_failed}</div><div class="kpi-foot">didn't pass the check</div></div>
  </div>
  <div class="panel-grid">
   <div class="panel"><div class="panel-head"><div class="panel-title">Moderators</div>
     <div class="seg"><button class="${COHORT_FILTER==='all'?'active':''}" onclick="setFilter('all')">All</button><button class="${COHORT_FILTER==='active'?'active':''}" onclick="setFilter('active')">In progress</button><button class="${COHORT_FILTER==='attention'?'active':''}" onclick="setFilter('attention')">Attention</button><button class="${COHORT_FILTER==='certified'?'active':''}" onclick="setFilter('certified')">Certified</button></div></div>
     ${localeChips}
     <table class="tbl"><thead><tr><th>Moderator</th><th>Progress</th><th>Quiz</th><th>Status</th><th>Last active</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="page-sub">No one in this view.</td></tr>'}</tbody></table></div>
   <div class="panel"><div class="panel-head"><div class="panel-title">Status breakdown</div></div><canvas id="chStatus" height="200"></canvas>
     <div style="margin-top:16px"><div class="panel-title" style="font-size:14px;margin-bottom:10px">Where people are in the path</div><canvas id="chStage" height="150"></canvas></div></div>
  </div>`;
}
function setFilter(f){COHORT_FILTER=f;renderView();}
function setLocaleFilter(loc){LOCALE_FILTER=loc;renderView();}
function modDetail(i){const m=COHORT[i];const pct=Math.round(m.done/MODULES.length*100);const sl=STAGE_LABEL[m.status];
 const rows=MODULES.map((mod,k)=>{const done=k<m.done;return `<div class="detail-row"><div class="d-ic ${done?'done':'pend'}">${done?'✓':k+1}</div><div style="flex:1">${mod.title}</div><span class="pill ${done?'done':'locked'}">${done?'Done':'Pending'}</span></div>`;}).join('');
 const grantOptions=MODULES.map(mod=>`<option value="${mod.id}">${mod.title}</option>`).join('');
 openModal(`<div class="modal-head"><div><div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)">${m.loc} · ${m.tz}</div><div class="modal-title">${m.name}</div></div><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div style="display:flex;gap:10px;margin-bottom:16px"><span class="pill ${sl[1]}">${sl[0]}</span>${m.score!=null?`<span class="pill ${m.score>=PASS80?'done':'red'}">Quiz ${m.score}%</span>`:''}<span class="page-sub" style="margin:0">Last active ${m.active}</span></div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px"><div class="mini-bar" style="flex:1"><span style="width:${pct}%"></span></div><span style="font-size:13px;color:var(--text2)">${m.done}/${MODULES.length} modules</span></div>
  <div style="font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:6px">Module progress</div>${rows}
  <div style="margin-top:20px;padding-top:16px;border-top:.5px solid var(--border)">
    <div style="font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:8px">Grant module credit</div>
    <div style="display:flex;gap:8px">
      <select id="grantModuleSelect" style="flex:1"><option value="">Choose a module…</option>${grantOptions}</select>
      <button class="btn btn-secondary" onclick="grantModuleCredit('${m.email}','${m.name.replace(/'/g,"\\'")}')">Grant</button>
    </div>
    <p style="font-size:12px;color:var(--text3);margin:6px 0 0">Writes a completed record for this moderator directly — use for makeups, tech issues, or manual corrections. This does not affect any other moderator's progress.</p>
  </div>
  <div style="display:flex;gap:10px;margin-top:16px">${m.status==='certified'?`<button class="btn btn-primary" style="flex:1" onclick="toast('Would add ${m.name.split(' ')[0]} to OneForma (demo)');closeModal()">Add to OneForma →</button>`:`<button class="btn btn-secondary" style="flex:1" onclick="toast('Reminder sent (demo)');closeModal()">Send a nudge</button>`}</div>`);
}
async function grantModuleCredit(email,name){
 const sel=document.getElementById('grantModuleSelect');const moduleId=sel.value;
 if(!moduleId){toast('Choose a module first');return;}
 const mod=MODULES.find(m=>m.id===moduleId);
 if(!confirm(`Grant credit for "${mod.title}" to ${name}?`))return;
 if(LIVE&&/^https?:\/\//.test(BACKEND.saveProgress)){
  try{
   await fetch(BACKEND.saveProgress,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({email:email,moduleId:moduleId,status:'done',score:''})});
   toast(`Credit granted for "${mod.title}" — refresh the dashboard to see it reflected.`);
  }catch(e){console.error('[Maple] grantModuleCredit failed:',e);toast('Grant failed — check your connection and try again.');}
 }else{
  toast(`Demo mode: would grant "${mod.title}" credit to ${name}. Wire up the live backend to make this permanent.`);
 }
 closeModal();
}

/* ===================== ADMIN: CURRICULUM ===================== */
function vCurriculum(){return `<div class="page-head"><div><div class="page-title">Curriculum</div><div class="page-sub">${MODULES.length} modules · what every moderator works through</div></div><button class="btn btn-secondary" onclick="toast('Editing modules — full build')">Edit modules</button></div>
  <div class="mods">${MODULES.map((m,i)=>`<div class="mod"><div class="mod-rail"><div class="mod-dot ${m.type==='quiz'?'active':''}">${m.type==='quiz'?'✓':i+1}</div>${i<MODULES.length-1?'<div class="mod-line"></div>':''}</div>
    <div class="mod-card" style="cursor:default"><div class="mod-ic">${m.ic}</div><div class="mod-meta"><div class="mod-name">${m.title}</div><div class="mod-sub">${m.sub}</div></div><div class="mod-right"><span class="mod-time">${m.min} min</span>${m.type==='quiz'?'<span class="pill amber">Graded</span>':'<span class="pill blue">Module</span>'}</div></div></div>`).join('')}</div>
  <div class="panel"><div class="panel-head"><div class="panel-title">Module comprehension checks</div><span class="pill blue">Flagged, not blocking</span></div><p class="page-sub" style="margin:0">${Object.values(MOD_QUESTIONS).reduce((a,q)=>a+q.length,0)} questions total, spread across each module's inline check. A moderator can continue past a wrong answer — completing every module is what certifies them for production, not a separate pass/fail score.</p></div>`;
}

/* ===================== CHARTS ===================== */
let _ch=[];
function drawCharts(){if(typeof Chart==='undefined')return;_ch.forEach(c=>{try{c.destroy();}catch(e){}});_ch=[];const dark=document.documentElement.getAttribute('data-theme')==='dark';Chart.defaults.font.family="-apple-system,'SF Pro Display',sans-serif";Chart.defaults.color=dark?'#a8a8b2':'#8a8a8e';const grid=dark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)';const s=cohortStats();
 const c1=document.getElementById('chStatus');if(c1)_ch.push(new Chart(c1,{type:'doughnut',data:{labels:['Certified','In progress','Not started','Needs attention'],datasets:[{data:[s.certified,s.in_progress,s.not_started,s.quiz_failed],backgroundColor:['#22c55e','#3b82f6','#77777f','#F59E0B'],borderWidth:0}]},options:{cutout:'62%',plugins:{legend:{position:'bottom',labels:{padding:12,font:{size:11},usePointStyle:true}}}}}));
 const c2=document.getElementById('chStage');if(c2){const counts=MODULES.map((m,i)=>COHORT.filter(x=>x.done>i).length);_ch.push(new Chart(c2,{type:'bar',data:{labels:MODULES.map((m,i)=>'M'+(i+1)),datasets:[{data:counts,backgroundColor:'#D9772E',borderRadius:5}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{title:(t)=>MODULES[t[0].dataIndex].title,label:(t)=>t.raw+' reached this module'}}},scales:{y:{grid:{color:grid},ticks:{precision:0,stepSize:2}},x:{grid:{display:false}}}}}));}
}

/* ===================== MODAL / MISC ===================== */
function openModal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
function toggleTheme(){const h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');persistLocal();if(VIEW==='dash')setTimeout(drawCharts,50);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600);}

/* preload directory/progress (demo data if URLs are placeholders), then
   silently resume the last signed-in moderator/admin if one is on file --
   mirrors Pine's auto-resume pattern instead of forcing a login every visit. */
loadData().then(()=>{
 const last=getLastLogin();
 if(last){const rec=findUser(last);if(rec){applyProfile(rec);restoreLocalSession(last);startApp(rec.role,rec.name);}}
});
</script>
</body>
</html>
